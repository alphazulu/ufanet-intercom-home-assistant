get_settings:
  name: Get integration settings
  description: Return the effective Ufanet Intercom Options Flow values for the selected device. Read-only.
  fields:
    device_id:
      name: Intercom
      required: true
      selector:
        device:
          integration: ufanet_intercom

get_runtime_status:
  name: Get runtime diagnostics
  description: Return token-free technical runtime state for the selected Ufanet intercom. Intended for the custom card diagnostics tab.
  fields:
    device_id:
      name: Intercom
      required: true
      selector:
        device:
          integration: ufanet_intercom

get_archive_ranges:
  name: Get archive ranges
  description: Return contiguous recorded archive ranges for a Ufanet intercom camera.
  fields:
    device_id:
      name: Intercom
      description: Ufanet Intercom device.
      required: true
      selector:
        device:
          integration: ufanet_intercom

get_archive_url:
  name: Get archive URL
  description: Return a temporary HLS archive URL for the selected date/time and duration.
  fields:
    device_id:
      name: Intercom
      description: Ufanet Intercom device.
      required: true
      selector:
        device:
          integration: ufanet_intercom
    start:
      name: Start time
      description: Archive start date and time. Naive values use the camera time zone (for example Asia/Vladivostok).
      required: true
      selector:
        datetime:
    duration:
      name: Duration
      description: Requested clip duration in seconds. It is clipped at recording gaps.
      required: false
      default: 300
      selector:
        number:
          min: 1
          max: 21600
          step: 1
          unit_of_measurement: s
          mode: box

get_archive_download_url:
  name: Get archive MP4 download URL
  description: Export the selected recorded archive interval to a persistent local MP4 file using ffmpeg. The file is stored in Home Assistant Media and can be downloaded through an authenticated media URL.
  fields:
    device_id:
      name: Intercom
      description: Ufanet Intercom device.
      required: true
      selector:
        device:
          integration: ufanet_intercom
    start:
      name: Start time
      description: Clip start date and time. Naive values use the camera time zone.
      required: true
      selector:
        datetime:
    duration:
      name: Duration
      description: Requested MP4 clip duration in seconds. It is clipped at recording gaps before ffmpeg export.
      required: false
      default: 300
      selector:
        number:
          min: 1
          max: 21600
          step: 1
          unit_of_measurement: s
          mode: box
    retention_days:
      name: Retention days
      description: Optional per-call override. If omitted, the value from the integration Options Flow is used.
      required: false
      default: 30
      selector:
        number:
          min: 0
          max: 3650
          step: 1
          unit_of_measurement: d
          mode: box
    max_total_mb:
      name: Maximum total size
      description: Optional per-call override. If omitted, the value from the integration Options Flow is used.
      required: false
      default: 5120
      selector:
        number:
          min: 0
          max: 1048576
          step: 1
          unit_of_measurement: MB
          mode: box

list_archive_exports:
  name: List archive exports
  description: List locally saved Ufanet MP4 exports for the selected intercom camera.
  fields:
    device_id:
      name: Intercom
      required: true
      selector:
        device:
          integration: ufanet_intercom

delete_archive_export:
  name: Delete archive export
  description: Permanently delete one locally saved MP4 export after verifying that its filename belongs to the selected intercom camera.
  fields:
    device_id:
      name: Intercom
      required: true
      selector:
        device:
          integration: ufanet_intercom
    filename:
      name: Filename
      required: true
      selector:
        text:

cleanup_archive_exports:
  name: Clean up archive exports
  description: Remove camera exports older than the retention period, then remove oldest exports until the total-size limit is satisfied.
  fields:
    device_id:
      name: Intercom
      required: true
      selector:
        device:
          integration: ufanet_intercom
    retention_days:
      name: Retention days
      required: false
      default: 30
      selector:
        number:
          min: 0
          max: 3650
          step: 1
          unit_of_measurement: d
          mode: box
    max_total_mb:
      name: Maximum total size
      required: false
      default: 5120
      selector:
        number:
          min: 0
          max: 1048576
          step: 1
          unit_of_measurement: MB
          mode: box

get_call_events:
  name: Get call events
  description: Return intercom call events for one camera-local calendar day.
  fields:
    device_id:
      name: Intercom
      description: Ufanet Intercom device.
      required: true
      selector:
        device:
          integration: ufanet_intercom
    date:
      name: Date
      description: Calendar date in the camera time zone.
      required: true
      selector:
        date:

get_motion_events:
  name: Get motion events
  description: Return privacy-minimized UCAMS motion event times for one camera-local calendar day. Read-only; provider camera/event identifiers are not returned.
  fields:
    device_id:
      name: Intercom
      description: Ufanet Intercom device.
      required: true
      selector:
        device:
          integration: ufanet_intercom
    date:
      name: Date
      description: Calendar date in the camera time zone.
      required: true
      selector:
        date:

get_last_call_preview_url:
  name: Get last call preview URL
  description: Return a fresh temporary HTTPS-only Ufanet preview URL after an explicit authenticated request. Provider-issued HTTP URLs are upgraded locally; no HTTP fallback is allowed. Do not persist or log the response.
  fields:
    device_id:
      name: Intercom
      description: Ufanet Intercom device.
      required: true
      selector:
        device:
          integration: ufanet_intercom

get_guest_access:
  name: Get guest access
  description: Return active temporary guest links and users with shared access for the selected intercom.
  fields:
    device_id:
      name: Intercom
      description: Ufanet Intercom device.
      required: true
      selector:
        device:
          integration: ufanet_intercom

create_guest_invite:
  name: Create guest invite
  description: Create an invitation URL that another Ufanet user can accept to obtain access to this intercom.
  fields:
    device_id:
      name: Intercom
      description: Ufanet Intercom device.
      required: true
      selector:
        device:
          integration: ufanet_intercom

forget_guest_invite:
  name: Forget generated guest invite
  description: Remove one locally stored generated invitation from Home Assistant. This does not revoke the invitation on the Ufanet server.
  fields:
    device_id:
      name: Intercom
      description: Ufanet Intercom device.
      required: true
      selector:
        device:
          integration: ufanet_intercom
    invite_id:
      name: Local invite ID
      description: Local Home Assistant ID returned when the invitation was generated.
      required: true
      selector:
        text:

revoke_shared_access:
  name: Revoke shared access
  description: Revoke one accepted guest/shared access grant after verifying that the access ID belongs to the selected Ufanet intercom.
  fields:
    device_id:
      name: Intercom
      description: Ufanet Intercom device.
      required: true
      selector:
        device:
          integration: ufanet_intercom
    access_id:
      name: Access ID
      description: Accepted shared-access ID returned by Ufanet shared/users.
      required: true
      selector:
        number:
          min: 1
          mode: box

create_temporary_guest_link:
  name: Create temporary guest link
  description: Create a temporary web key for opening the selected Ufanet intercom. Duration is sent to Ufanet in minutes.
  fields:
    device_id:
      name: Intercom
      required: true
      selector:
        device:
          integration: ufanet_intercom
    duration_minutes:
      name: Duration
      description: Temporary-key lifetime in minutes.
      required: true
      selector:
        number:
          min: 1
          max: 10080
          unit_of_measurement: min
          mode: box

revoke_temporary_guest_link:
  name: Revoke temporary guest link
  description: Revoke one active temporary Ufanet web key after verifying that its token belongs to the selected intercom.
  fields:
    device_id:
      name: Intercom
      required: true
      selector:
        device:
          integration: ufanet_intercom
    token:
      name: Token
      description: Token extracted from the active temporary guest URL.
      required: true
      selector:
        text:

list_authorized_devices:
  name: List authorized Ufanet devices
  description: Return the Ufanet account's authorized-device inventory with device title, last activity, platform and call-access status. Raw provider device IDs are never returned; Home Assistant-owned registrations are marked protected.
  fields:
    device_id:
      name: Intercom
      required: true
      selector:
        device:
          integration: ufanet_intercom

revoke_authorized_device:
  name: Revoke Ufanet device authorization
  description: Revoke one non-Home-Assistant Ufanet device authorization through logout_device. This is an account authorization action and does not use the FCM registration/unregistration endpoint.
  fields:
    device_id:
      name: Intercom
      required: true
      selector:
        device:
          integration: ufanet_intercom
    authorization_ref:
      name: Authorization reference
      description: Opaque authorization_ref returned by list_authorized_devices. Raw Ufanet device IDs are not accepted.
      required: true
      selector:
        text:
    confirm:
      name: Confirm revocation
      description: Must be enabled to perform the destructive authorization revoke.
      required: true
      selector:
        boolean:

revoke_other_authorized_devices:
  name: Revoke other Ufanet device authorizations
  description: Revoke the current snapshot of all non-Home-Assistant Ufanet device authorizations. Requires the exact revocable_count returned by list_authorized_devices and aborts if it changed.
  fields:
    device_id:
      name: Intercom
      required: true
      selector:
        device:
          integration: ufanet_intercom
    expected_count:
      name: Expected revocable authorizations
      description: Exact revocable_count returned by the most recent list_authorized_devices call.
      required: true
      selector:
        number:
          min: 1
          step: 1
          mode: box
    confirm:
      name: Confirm mass revocation
      description: Must be enabled to perform the destructive authorization revoke.
      required: true
      selector:
        boolean:

list_fcm_registrations:
  name: List advanced FCM registrations
  description: Advanced view using the provider authorized-device inventory as the selectable device set for FCM cleanup. This does not expose FCM tokens or raw provider device IDs.
  fields:
    device_id:
      name: Intercom
      required: true
      selector:
        device:
          integration: ufanet_intercom

unregister_fcm_registration:
  name: Unregister FCM push registration
  description: Advanced action that removes one non-Home-Assistant push registration using DELETE /api/v0/fcm/. It does not call logout_device and does not claim to revoke the device JWT authorization.
  fields:
    device_id:
      name: Intercom
      required: true
      selector:
        device:
          integration: ufanet_intercom
    fcm_ref:
      name: FCM reference
      description: Opaque fcm_ref returned by list_fcm_registrations. Raw Ufanet device IDs and FCM tokens are not accepted.
      required: true
      selector:
        text:
    confirm:
      name: Confirm FCM cleanup
      description: Must be enabled to remove the provider push registration.
      required: true
      selector:
        boolean:

unregister_other_fcm_registrations:
  name: Unregister other FCM push registrations
  description: Advanced action that removes the current snapshot of all non-Home-Assistant push registrations with DELETE /api/v0/fcm/. It does not call logout_device.
  fields:
    device_id:
      name: Intercom
      required: true
      selector:
        device:
          integration: ufanet_intercom
    expected_count:
      name: Expected removable registrations
      description: Exact removable_count returned by the most recent list_fcm_registrations call.
      required: true
      selector:
        number:
          min: 1
          step: 1
          mode: box
    confirm:
      name: Confirm mass FCM cleanup
      description: Must be enabled to remove the provider push registrations.
      required: true
      selector:
        boolean:

list_fcm_sessions:
  name: List authorized sessions (legacy name)
  description: Legacy compatibility alias. Despite its historical name, this returns the same authorized Ufanet device/session inventory used by logout_device. Prefer list_authorized_devices for new automations.
  fields:
    device_id:
      name: Intercom
      required: true
      selector:
        device:
          integration: ufanet_intercom

revoke_fcm_session:
  name: Revoke authorization (legacy name)
  description: Legacy compatibility alias. This calls logout_device and revokes a Ufanet device authorization; it is not the FCM-only unregister action. Prefer revoke_authorized_device for new automations.
  fields:
    device_id:
      name: Intercom
      required: true
      selector:
        device:
          integration: ufanet_intercom
    session_ref:
      name: Session reference
      description: Opaque session_ref returned by list_fcm_sessions. Raw Ufanet device IDs are not accepted.
      required: true
      selector:
        text:
    confirm:
      name: Confirm revocation
      description: Must be enabled to perform the destructive action.
      required: true
      selector:
        boolean:

revoke_other_fcm_sessions:
  name: Revoke authorizations (legacy name)
  description: Legacy compatibility alias. This calls logout_device for non-Home-Assistant authorized devices. Prefer revoke_other_authorized_devices for new automations.
  fields:
    device_id:
      name: Intercom
      required: true
      selector:
        device:
          integration: ufanet_intercom
    expected_count:
      name: Expected revocable sessions
      description: Exact revocable_count returned by the most recent list_fcm_sessions call.
      required: true
      selector:
        number:
          min: 1
          step: 1
          mode: box
    confirm:
      name: Confirm mass revocation
      description: Must be enabled to perform the destructive action.
      required: true
      selector:
        boolean:

list_physical_keys:
  name: List physical keys
  description: Return a fresh privacy-safe physical-key inventory for the selected intercom. The response includes only an opaque key_ref, user-facing name, and creation time; provider IDs and external_id are never returned.
  fields:
    device_id:
      name: Intercom
      description: Ufanet Intercom device with physical-key recording support.
      required: true
      selector:
        device:
          integration: ufanet_intercom

rename_physical_key:
  name: Rename physical key
  description: Rename one physical key selected by the opaque key_ref returned by List physical keys. The inventory is refreshed before the request and the new name is verified afterward; raw provider key IDs are never accepted or returned.
  fields:
    device_id:
      name: Intercom
      description: Ufanet Intercom device to which the key is assigned.
      required: true
      selector:
        device:
          integration: ufanet_intercom
    key_ref:
      name: Key reference
      description: Opaque key_ref returned by List physical keys. Raw provider key IDs are not accepted.
      required: true
      selector:
        text:
    new_name:
      name: New name
      description: New user-facing name for the physical key.
      required: true
      selector:
        text:

get_physical_key_passages:
  name: Get physical key passage history
  description: Return one privacy-safe page of passage times for a physical key selected by opaque key_ref. Provider key IDs, provider key names and raw response fields are never returned.
  fields:
    device_id:
      name: Intercom
      description: Ufanet Intercom device to which the selected key is assigned.
      required: true
      selector:
        device:
          integration: ufanet_intercom
    key_ref:
      name: Key reference
      description: Opaque key_ref returned by List physical keys. Raw provider key IDs are not accepted.
      required: true
      selector:
        text:
    page:
      name: Page
      description: Zero-based passage-history page. The validation UI requests 25 rows per page.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 1000
          step: 1
          mode: box