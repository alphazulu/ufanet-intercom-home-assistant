name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: codex/fcm-session-security

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt

      - name: Apply sessions UI patch
        run: python tools/research/apply_fcm_sessions_ui_patch.py

      - name: Parse frontend and run focused tests
        run: |
          node --check custom_components/ufanet_intercom/frontend/ufanet-archive-card.js
          pytest -q tests/test_frontend_privacy.py tests/test_fcm_session_services.py tests/test_fcm_sessions.py
          pytest -q

      - name: Commit verified UI patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout HEAD^ -- .github/workflows/tests.yml
          git rm tools/research/apply_fcm_sessions_ui_patch.py
          git add custom_components/ufanet_intercom/frontend/ufanet-archive-card.js tests/test_frontend_privacy.py .github/workflows/tests.yml
          git commit -m "Add authorized device security UI"
          git push origin HEAD:codex/fcm-session-security
