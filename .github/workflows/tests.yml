name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Apply v0.30.0 release prep once
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/release-v0.30.0'
        shell: bash
        run: |
          set -euo pipefail
          python tools/research/release_prep_v030.py
          git fetch origin main
          git checkout origin/main -- .github/workflows/tests.yml
          rm tools/research/release_prep_v030.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Prepare v0.30.0 release"
          git push origin HEAD:codex/release-v0.30.0

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt

      - name: Compile research scripts
        run: |
          python -m py_compile \
            tools/research/fcm_probe_py/probe.py \
            tools/research/fcm_probe_py/extract_firebase_config.py \
            tools/research/key_passage_probe_py/probe.py \
            tools/research/ucams_analytics_probe_py/probe.py

      - name: Run pytest with coverage
        shell: bash
        run: |
          set -o pipefail
          pytest -vv \
            --junitxml=pytest-results.xml \
            --cov=custom_components.ufanet_intercom.api \
            --cov=custom_components.ufanet_intercom.config_flow \
            --cov=custom_components.ufanet_intercom.archive \
            --cov=custom_components.ufanet_intercom.auto_export \
            --cov=custom_components.ufanet_intercom.coordinator \
            --cov=custom_components.ufanet_intercom.diagnostics \
            --cov=custom_components.ufanet_intercom.fcm \
            --cov=custom_components.ufanet_intercom.firebase_config \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            2>&1 | tee pytest-output.txt

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: |
            pytest-output.txt
            pytest-results.xml
          if-no-files-found: warn
          retention-days: 14
