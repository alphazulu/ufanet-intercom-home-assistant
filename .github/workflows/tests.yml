name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt

      - name: Compile research scripts
        run: |
          python -m py_compile \
            tools/research/auth_session_probe_py/probe.py \
            tools/research/auth_session_probe_py/revoke_authorized_device_probe.py \
            tools/research/auth_session_probe_py/unregister_fcm_only_probe.py \
            tools/research/fcm_probe_py/probe.py \
            tools/research/fcm_probe_py/authorized_devices_probe.py \
            tools/research/fcm_probe_py/logout_jwt_probe.py \
            tools/research/fcm_probe_py/fcm_delete_jwt_probe.py \
            tools/research/fcm_probe_py/extract_firebase_config.py \
            tools/research/key_passage_probe_py/probe.py \
            tools/research/ucams_analytics_probe_py/probe.py

      - name: Check frontend JavaScript syntax
        run: |
          node --check custom_components/ufanet_intercom/frontend/ufanet-archive-card.js
          node --check custom_components/ufanet_intercom/frontend/ufanet-physical-keys-card.js
          node --check custom_components/ufanet_intercom/frontend/ufanet-key-history-card.js
          node --check custom_components/ufanet_intercom/frontend/ufanet-private-camera-card.js
          node --check custom_components/ufanet_intercom/frontend/ufanet-authorized-devices-card.js

      - name: Run pytest with protected coverage threshold
        shell: bash
        run: |
          set -o pipefail
          pytest -vv \
            --junitxml=pytest-results.xml \
            --cov=custom_components.ufanet_intercom.api \
            --cov=custom_components.ufanet_intercom.config_flow \
            --cov=custom_components.ufanet_intercom.archive \
            --cov=custom_components.ufanet_intercom.auto_export \
            --cov=custom_components.ufanet_intercom.coordinator \
            --cov=custom_components.ufanet_intercom.diagnostics \
            --cov=custom_components.ufanet_intercom.fcm \
            --cov=custom_components.ufanet_intercom.firebase_config \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            2>&1 | tee pytest-output.txt

      - name: Audit full integration coverage
        shell: bash
        run: |
          set -o pipefail
          pytest -q \
            --cov=custom_components.ufanet_intercom \
            --cov-report=term-missing \
            --cov-report=xml:full-coverage.xml \
            --cov-fail-under=0 \
            2>&1 | tee full-coverage-output.txt

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: |
            pytest-output.txt
            pytest-results.xml
            full-coverage-output.txt
            full-coverage.xml
          if-no-files-found: warn
          retention-days: 14
