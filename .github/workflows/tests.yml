name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt

      - name: Run pytest with coverage
        shell: bash
        run: |
          set -o pipefail
          pytest -vv \
            --junitxml=pytest-results.xml \
            --cov=custom_components.ufanet_intercom.api \
            --cov=custom_components.ufanet_intercom.config_flow \
            --cov=custom_components.ufanet_intercom.archive \
            --cov=custom_components.ufanet_intercom.auto_export \
            --cov=custom_components.ufanet_intercom.diagnostics \
            --cov=custom_components.ufanet_intercom.__init__ \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            2>&1 | tee pytest-output.txt

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: |
            pytest-output.txt
            pytest-results.xml
          if-no-files-found: warn
          retention-days: 14
