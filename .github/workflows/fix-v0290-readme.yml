name: Fix v0.29.0 README release references

on:
  push:
    branches:
      - codex/archive-motion-timeline

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/archive-motion-timeline
      - name: Fix stale release references
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "README.md": [
                  ("For release v0.28.0 the cache-bust URL is:", "For release v0.29.0 the cache-bust URL is:"),
                  ("capability, v0.28.0 creates a **Motion detected** event entity", "capability, v0.29.0 creates a **Motion detected** event entity"),
              ],
              "README_RU.md": [
                  ("Для релиза v0.28.0 cache-bust URL такой:", "Для релиза v0.29.0 cache-bust URL такой:"),
                  ("capability `motion_alarm`, v0.28.0 создаёт event entity", "capability `motion_alarm`, v0.29.0 создаёт event entity"),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{filename}: expected exactly one occurrence of {old!r}, found {count}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

          Path(".github/workflows/fix-v0290-readme.yml").unlink()
          PY
      - name: Verify stale release references are gone
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename in ("README.md", "README_RU.md"):
              text = Path(filename).read_text(encoding="utf-8")
              if "v0.28.0" in text:
                  raise SystemExit(f"{filename}: stale v0.28.0 reference remains")
              if "ufanet-archive-card.js?v=0.29.0" not in text:
                  raise SystemExit(f"{filename}: v0.29.0 Lovelace URL missing")
          PY
      - name: Commit documentation correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix v0.29.0 README release references"
          git push origin HEAD:codex/archive-motion-timeline
