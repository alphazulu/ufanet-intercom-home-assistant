name: Apply FCM authorized age audit

on:
  push:
    branches:
      - codex/fcm-authorized-devices-audit
    paths:
      - .github/workflows/apply-fcm-authorized-age-audit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fcm-authorized-devices-audit
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Apply reviewed patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          probe = Path('tools/research/fcm_probe_py/probe.py')
          text = probe.read_text(encoding='utf-8')
          text = text.replace(
              'from datetime import datetime\n',
              'from datetime import datetime, timezone\n',
              1,
          )

          old = '''def summarize_authorized_devices(payload: Any) -> dict[str, Any]:
              """Reduce authorized-device data to privacy-safe aggregate schema facts."""
              if not isinstance(payload, dict):
                  raise RuntimeError("Unexpected authorized-devices response schema")
              data = payload.get("data")
              if not isinstance(data, dict):
                  raise RuntimeError("Unexpected authorized-devices response schema")
              devices = data.get("device_list")
              if not isinstance(devices, list):
                  raise RuntimeError("Unexpected authorized-devices response schema")

              valid_objects = 0
              invalid_entries = 0
              with_device_id = 0
              unique_device_ids: set[str] = set()
              with_title = 0
              with_last_update = 0
              parseable_last_update = 0
              with_call_access = 0
              call_access_true = 0
              call_access_false = 0
              call_access_invalid = 0
              unknown_fields: set[str] = set()

              for item in devices:
                  if not isinstance(item, dict):
                      invalid_entries += 1
                      continue
                  valid_objects += 1
                  unknown_fields.update(
                      str(key) for key in item if str(key) not in EXPECTED_AUTHORIZED_DEVICE_FIELDS
                  )

                  device_id = item.get("device_id")
                  if device_id not in (None, ""):
                      with_device_id += 1
                      unique_device_ids.add(str(device_id))

                  if item.get("title") not in (None, ""):
                      with_title += 1

                  last_update = item.get("last_update")
                  if last_update not in (None, ""):
                      with_last_update += 1
                      if parse_iso_datetime(last_update) is not None:
                          parseable_last_update += 1

                  if "is_call_access" in item:
                      with_call_access += 1
                      call_access = item.get("is_call_access")
                      if call_access is True:
                          call_access_true += 1
                      elif call_access is False:
                          call_access_false += 1
                      else:
                          call_access_invalid += 1

              permission = data.get("devices_num_permission", ...)
              if permission is ...:
                  permission_state = "absent"
              elif permission is True:
                  permission_state = "true"
              elif permission is False:
                  permission_state = "false"
              else:
                  permission_state = "invalid_type"

              return {
                  "total": len(devices),
                  "valid_objects": valid_objects,
                  "invalid_entries": invalid_entries,
                  "with_device_id": with_device_id,
                  "unique_device_ids": len(unique_device_ids),
                  "duplicate_device_ids": max(0, with_device_id - len(unique_device_ids)),
                  "with_title": with_title,
                  "with_last_update": with_last_update,
                  "parseable_last_update": parseable_last_update,
                  "with_call_access": with_call_access,
                  "call_access_true": call_access_true,
                  "call_access_false": call_access_false,
                  "call_access_invalid": call_access_invalid,
                  "unknown_field_names": len(unknown_fields),
                  "devices_num_permission": permission_state,
              }
          '''
          new = '''def summarize_authorized_devices(
              payload: Any,
              *,
              now: datetime | None = None,
          ) -> dict[str, Any]:
              """Reduce authorized-device data to privacy-safe aggregate schema facts."""
              if not isinstance(payload, dict):
                  raise RuntimeError("Unexpected authorized-devices response schema")
              data = payload.get("data")
              if not isinstance(data, dict):
                  raise RuntimeError("Unexpected authorized-devices response schema")
              devices = data.get("device_list")
              if not isinstance(devices, list):
                  raise RuntimeError("Unexpected authorized-devices response schema")

              reference_time = now or datetime.now(timezone.utc)
              if reference_time.tzinfo is None:
                  raise RuntimeError("Authorized-devices audit reference time must be timezone-aware")
              reference_time = reference_time.astimezone(timezone.utc)

              valid_objects = 0
              invalid_entries = 0
              with_device_id = 0
              unique_device_ids: set[str] = set()
              with_title = 0
              with_last_update = 0
              parseable_last_update = 0
              last_update_age_le_24h = 0
              last_update_age_1_7d = 0
              last_update_age_7_30d = 0
              last_update_age_30_90d = 0
              last_update_age_gt_90d = 0
              last_update_age_future = 0
              with_call_access = 0
              call_access_true = 0
              call_access_false = 0
              call_access_invalid = 0
              unknown_fields: set[str] = set()

              for item in devices:
                  if not isinstance(item, dict):
                      invalid_entries += 1
                      continue
                  valid_objects += 1
                  unknown_fields.update(
                      str(key) for key in item if str(key) not in EXPECTED_AUTHORIZED_DEVICE_FIELDS
                  )

                  device_id = item.get("device_id")
                  if device_id not in (None, ""):
                      with_device_id += 1
                      unique_device_ids.add(str(device_id))

                  if item.get("title") not in (None, ""):
                      with_title += 1

                  last_update = item.get("last_update")
                  if last_update not in (None, ""):
                      with_last_update += 1
                      parsed_last_update = parse_iso_datetime(last_update)
                      if parsed_last_update is not None:
                          parseable_last_update += 1
                          age_seconds = (
                              reference_time - parsed_last_update.astimezone(timezone.utc)
                          ).total_seconds()
                          if age_seconds < 0:
                              last_update_age_future += 1
                          elif age_seconds <= 24 * 60 * 60:
                              last_update_age_le_24h += 1
                          elif age_seconds <= 7 * 24 * 60 * 60:
                              last_update_age_1_7d += 1
                          elif age_seconds <= 30 * 24 * 60 * 60:
                              last_update_age_7_30d += 1
                          elif age_seconds <= 90 * 24 * 60 * 60:
                              last_update_age_30_90d += 1
                          else:
                              last_update_age_gt_90d += 1

                  if "is_call_access" in item:
                      with_call_access += 1
                      call_access = item.get("is_call_access")
                      if call_access is True:
                          call_access_true += 1
                      elif call_access is False:
                          call_access_false += 1
                      else:
                          call_access_invalid += 1

              permission = data.get("devices_num_permission", ...)
              if permission is ...:
                  permission_state = "absent"
              elif permission is True:
                  permission_state = "true"
              elif permission is False:
                  permission_state = "false"
              else:
                  permission_state = "invalid_type"

              return {
                  "total": len(devices),
                  "valid_objects": valid_objects,
                  "invalid_entries": invalid_entries,
                  "with_device_id": with_device_id,
                  "unique_device_ids": len(unique_device_ids),
                  "duplicate_device_ids": max(0, with_device_id - len(unique_device_ids)),
                  "with_title": with_title,
                  "with_last_update": with_last_update,
                  "parseable_last_update": parseable_last_update,
                  "last_update_age_le_24h": last_update_age_le_24h,
                  "last_update_age_1_7d": last_update_age_1_7d,
                  "last_update_age_7_30d": last_update_age_7_30d,
                  "last_update_age_30_90d": last_update_age_30_90d,
                  "last_update_age_gt_90d": last_update_age_gt_90d,
                  "last_update_age_future": last_update_age_future,
                  "with_call_access": with_call_access,
                  "call_access_true": call_access_true,
                  "call_access_false": call_access_false,
                  "call_access_invalid": call_access_invalid,
                  "unknown_field_count": len(unknown_fields),
                  "unknown_field_names": tuple(sorted(unknown_fields)),
                  "devices_num_permission": permission_state,
              }
          '''
          if old not in text:
              raise SystemExit('summarize_authorized_devices block not found')
          text = text.replace(old, new, 1)

          old = '''async def audit_authorized_devices(
              session: aiohttp.ClientSession,
              access_token: str,
              base_url: str,
          ) -> dict[str, Any]:
          '''
          new = '''async def audit_authorized_devices(
              session: aiohttp.ClientSession,
              access_token: str,
              base_url: str,
              *,
              now: datetime | None = None,
          ) -> dict[str, Any]:
          '''
          if old not in text:
              raise SystemExit('audit signature not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '    summary = summarize_authorized_devices(payload)\n',
              '    summary = summarize_authorized_devices(payload, now=now)\n',
              1,
          )

          old = '''    for key in (
                  "total",
                  "valid_objects",
                  "invalid_entries",
                  "with_device_id",
                  "unique_device_ids",
                  "duplicate_device_ids",
                  "with_title",
                  "with_last_update",
                  "parseable_last_update",
                  "with_call_access",
                  "call_access_true",
                  "call_access_false",
                  "call_access_invalid",
                  "unknown_field_names",
                  "devices_num_permission",
              ):
                  print(f"  {key}: {summary[key]}")
              return summary
          '''
          new = '''    for key in (
                  "total",
                  "valid_objects",
                  "invalid_entries",
                  "with_device_id",
                  "unique_device_ids",
                  "duplicate_device_ids",
                  "with_title",
                  "with_last_update",
                  "parseable_last_update",
                  "last_update_age_le_24h",
                  "last_update_age_1_7d",
                  "last_update_age_7_30d",
                  "last_update_age_30_90d",
                  "last_update_age_gt_90d",
                  "last_update_age_future",
                  "with_call_access",
                  "call_access_true",
                  "call_access_false",
                  "call_access_invalid",
                  "unknown_field_count",
              ):
                  print(f"  {key}: {summary[key]}")
              unknown_names = summary["unknown_field_names"]
              print(
                  "  unknown_field_names: "
                  + (", ".join(unknown_names) if unknown_names else "(none)")
              )
              print(f"  devices_num_permission: {summary['devices_num_permission']}")
              return summary
          '''
          if old not in text:
              raise SystemExit('audit output block not found')
          text = text.replace(old, new, 1)
          probe.write_text(text, encoding='utf-8', newline='\n')

          tests = Path('tests/test_fcm_probe.py')
          text = tests.read_text(encoding='utf-8')
          text = text.replace(
              'import json\nfrom pathlib import Path\n',
              'import json\nfrom datetime import datetime, timezone\nfrom pathlib import Path\n',
              1,
          )
          text = text.replace(
              '''    summary = await probe.audit_authorized_devices(
                  session, "access-token", "https://example.test"
              )
          ''',
              '''    summary = await probe.audit_authorized_devices(
                  session,
                  "access-token",
                  "https://example.test",
                  now=datetime(2026, 9, 2, 16, 0, tzinfo=timezone.utc),
              )
          ''',
              1,
          )
          old = '''        "with_last_update": 2,
                  "parseable_last_update": 2,
                  "with_call_access": 2,
                  "call_access_true": 1,
                  "call_access_false": 1,
                  "call_access_invalid": 0,
                  "unknown_field_names": 1,
                  "devices_num_permission": "true",
          '''
          new = '''        "with_last_update": 2,
                  "parseable_last_update": 2,
                  "last_update_age_le_24h": 2,
                  "last_update_age_1_7d": 0,
                  "last_update_age_7_30d": 0,
                  "last_update_age_30_90d": 0,
                  "last_update_age_gt_90d": 0,
                  "last_update_age_future": 0,
                  "with_call_access": 2,
                  "call_access_true": 1,
                  "call_access_false": 1,
                  "call_access_invalid": 0,
                  "unknown_field_count": 1,
                  "unknown_field_names": ("provider_private_extra",),
                  "devices_num_permission": "true",
          '''
          if old not in text:
              raise SystemExit('test summary block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '        "provider_private_extra",\n',
              '',
              1,
          )
          insert = '''

          def test_authorized_devices_age_buckets_do_not_expose_timestamps() -> None:
              payload = {
                  "data": {
                      "device_list": [
                          {"last_update": "2026-09-02T15:00:00Z"},
                          {"last_update": "2026-08-30T16:00:00Z"},
                          {"last_update": "2026-08-15T16:00:00Z"},
                          {"last_update": "2026-07-01T16:00:00Z"},
                          {"last_update": "2026-01-01T00:00:00Z"},
                          {"last_update": "2026-09-03T16:00:00Z"},
                      ],
                      "devices_num_permission": False,
                  }
              }
              summary = probe.summarize_authorized_devices(
                  payload,
                  now=datetime(2026, 9, 2, 16, 0, tzinfo=timezone.utc),
              )

              assert summary["last_update_age_le_24h"] == 1
              assert summary["last_update_age_1_7d"] == 1
              assert summary["last_update_age_7_30d"] == 1
              assert summary["last_update_age_30_90d"] == 1
              assert summary["last_update_age_gt_90d"] == 1
              assert summary["last_update_age_future"] == 1
              assert summary["devices_num_permission"] == "false"
          '''
          marker = '\ndef test_authorized_devices_summary_rejects_unknown_envelope_without_values() -> None:\n'
          if marker not in text:
              raise SystemExit('test insertion marker not found')
          text = text.replace(marker, insert + marker, 1)
          tests.write_text(text, encoding='utf-8', newline='\n')

          readme = Path('tools/research/fcm_probe_py/README_RU.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
              'До live-подтверждения endpoint считается **Observed only**. Probe намеренно не печатает\n',
              'Endpoint **live-confirmed** 2 сентября 2026 года. Probe намеренно не печатает\n',
              1,
          )
          text = text.replace(
              'уникальных/дублирующихся `device_id`, распределение `is_call_access`, число неизвестных\nимён полей и тип/булево состояние `devices_num_permission`.\n',
              'уникальных/дублирующихся `device_id`, распределение `is_call_access`, возрастные корзины\n`last_update` без точных дат, имена неизвестных schema-полей без их значений и\nтип/булево состояние `devices_num_permission`.\n',
              1,
          )
          text = text.replace(
              '''  with_last_update: 3
              parseable_last_update: 3
              with_call_access: 3
          ''',
              '''  with_last_update: 3
              parseable_last_update: 3
              last_update_age_le_24h: 1
              last_update_age_1_7d: 1
              last_update_age_7_30d: 0
              last_update_age_30_90d: 0
              last_update_age_gt_90d: 1
              last_update_age_future: 0
              with_call_access: 3
          ''',
              1,
          )
          text = text.replace(
              '''  unknown_field_names: 0
              devices_num_permission: true
          ''',
              '''  unknown_field_count: 2
              unknown_field_names: <schema_field_1>, <schema_field_2>
              devices_num_permission: true
          ''',
              1,
          )
          readme.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Compile probe
        run: python -m py_compile tools/research/fcm_probe_py/probe.py tests/test_fcm_probe.py

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-fcm-authorized-age-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/research/fcm_probe_py/probe.py tests/test_fcm_probe.py tools/research/fcm_probe_py/README_RU.md .github/workflows/apply-fcm-authorized-age-audit.yml
          git commit -m "Extend authorized devices audit with age buckets"
          git push origin HEAD:codex/fcm-authorized-devices-audit
