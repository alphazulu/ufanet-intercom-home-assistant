name: Apply archive motion timeline patch

on:
  push:
    branches:
      - codex/archive-motion-timeline

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/archive-motion-timeline
      - name: Repair generated patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_motion_timeline_patch.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace("'''\\n(ROOT", "'''\n(ROOT")
          old = '''    if found != count:\n        raise RuntimeError(f"{path}: expected {count} occurrence(s), found {found}")\n'''
          new = '''    if found != count:\n        duplicate_import_anchor = (\n            path == "custom_components/ufanet_intercom/services.py"\n            and old in {\n                "from .api import (\\n",\n                "    SERVICE_GET_CALL_EVENTS,\\n",\n            }\n            and found == 2\n            and count == 1\n        )\n        if not duplicate_import_anchor:\n            raise RuntimeError(f"{path}: expected {count} occurrence(s), found {found}")\n'''
          if old not in text:
              raise SystemExit('replace() guard anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply strict patch
        run: python tools/apply_motion_timeline_patch.py
      - name: Verify parsers
        run: |
          python -m py_compile custom_components/ufanet_intercom/analytics.py custom_components/ufanet_intercom/services.py custom_components/ufanet_intercom/const.py
          node --check custom_components/ufanet_intercom/frontend/ufanet-archive-card.js
      - name: Commit feature changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add motion events to archive timeline"
          git push origin HEAD:codex/archive-motion-timeline
