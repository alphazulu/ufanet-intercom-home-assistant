name: Publish v0.29.0 once

on:
  push:
    branches:
      - codex/archive-motion-timeline
    paths:
      - .github/workflows/publish-v0290-once.yml

permissions:
  contents: write

jobs:
  publish:
    name: Validate and publish v0.29.0
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'Trigger v0.29.0 publication'
    runs-on: ubuntu-latest

    steps:
      - name: Check out exact release target
        uses: actions/checkout@v4
        with:
          ref: 7dc4a69160c33ffafc76322a3f9719c4df1465c1
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Validate exact release target
        shell: bash
        run: |
          set -euo pipefail
          manifest_version="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("custom_components/ufanet_intercom/manifest.json").read_text(encoding="utf-8"))["version"])')"
          test "$manifest_version" = "0.29.0"
          test "$(git rev-parse HEAD)" = "7dc4a69160c33ffafc76322a3f9719c4df1465c1"
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD
          if git ls-remote --exit-code --tags origin refs/tags/v0.29.0 >/dev/null 2>&1; then
            echo "::error::Tag v0.29.0 already exists; refusing to move or replace it"
            exit 1
          fi

      - name: Run strict repository release checks
        run: python scripts/release_check.py --strict-hacs

      - name: Build release notes from changelog
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Ufanet Intercom v0.29.0"
            echo
            awk '/^## 0\.29\.0$/{found=1; next} /^## / && found{exit} found{print}' CHANGELOG.md
            echo
            echo "### Validation"
            echo
            echo "- Repository release checks passed before publication."
            echo "- The release tag points to the validated target commit."
          } > release-notes.md
          grep -q '^## Ufanet Intercom v0.29.0$' release-notes.md
          grep -q '[^[:space:]]' release-notes.md

      - name: Create immutable tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.29.0 \
            --target 7dc4a69160c33ffafc76322a3f9719c4df1465c1 \
            --title "Ufanet Intercom v0.29.0" \
            --notes-file release-notes.md
