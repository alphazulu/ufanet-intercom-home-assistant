name: Bootstrap component

on:
  push:
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore integration tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part* | base64 -d > /tmp/ufanet-component.tar.xz
          echo '3834229df9a1b1f51133c95fd36441a42e4bd3707033a11ad001dfbfcd3a01a1  /tmp/ufanet-component.tar.xz' | sha256sum -c -
          rm -rf custom_components/ufanet_intercom
          tar -xJf /tmp/ufanet-component.tar.xz
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-component.yml
      - name: Commit restored v0.19.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Ufanet Intercom v0.19.1'
          git push origin HEAD:main
