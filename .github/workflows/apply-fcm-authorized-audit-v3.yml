name: Apply FCM authorized devices audit v3

on:
  push:
    branches:
      - codex/fcm-authorized-devices-audit
    paths:
      - .github/workflows/apply-fcm-authorized-audit-v3.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fcm-authorized-devices-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install focused test dependencies
        run: |
          python -m pip install -r tools/research/fcm_probe_py/requirements.txt pytest pytest-asyncio
      - name: Apply the already-reviewed patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-fcm-authorized-audit.yml')
          text = workflow.read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          script = text[start:end]
          # The workflow embeds the script with ten spaces of YAML indentation.
          lines = [line[10:] if line.startswith('          ') else line for line in script.splitlines()]
          source = '\n'.join(lines) + '\n'
          exec(compile(source, str(workflow), 'exec'))
          PY
          rm -f .github/workflows/apply-fcm-authorized-audit-v2.yml
          rm -f .github/workflows/apply-fcm-authorized-audit-v3.yml
      - name: Validate patch
        shell: bash
        run: |
          python -m py_compile tools/research/fcm_probe_py/probe.py
          python -m pytest -q tests/test_fcm_probe.py
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add read-only FCM authorized devices audit"
          git push origin HEAD:codex/fcm-authorized-devices-audit
