          rep("docs/notifications.md", "The overall 0.31.0 validation branch is still **not release-ready** because the new physical-key enrollment / real `reason=key_add` flow remains pending.", "This notification path shipped in v0.31.0. The former physical-key enrollment / real `reason=key_add` release gate was closed by end-to-end live validation before publication.")
