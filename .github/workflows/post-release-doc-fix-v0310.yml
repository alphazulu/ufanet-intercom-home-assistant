name: Post-release documentation synchronization

on:
  push:
    branches:
      - codex/post-release-audit-v0.31.0
    paths:
      - .github/workflows/post-release-doc-fix-v0310.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize v0.31.0 documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def rep(path, old, new, *, required=True):
              text = read(path)
              if old not in text:
                  if required:
                      raise SystemExit(f"expected text not found in {path}: {old[:120]!r}")
                  return
              write(path, text.replace(old, new))

          def rex(path, pattern, replacement):
              text = read(path)
              new, count = re.subn(pattern, replacement, text, flags=re.S)
              if count != 1:
                  raise SystemExit(f"expected exactly one regex match in {path}, got {count}: {pattern}")
              write(path, new)

          # Root READMEs: replace obsolete release-candidate status with published state.
          rex(
              "README.md",
              r"## Current validation / 0\.31\.0 release candidate\n.*?\n## Unofficial API documentation",
              """## Current release: v0.31.0

Version **v0.31.0** was published on 2026-09-09 after the release candidate was merged and the final release commit passed Tests, HACS/Hassfest and the repository release self-check. The release tag points to the published `main` state.

Live-confirmed release evidence includes:

- Android actionable incoming-call notifications from real Ufanet calls;
- guarded **Open door** physically opening the configured door and **View camera** opening the selected same-device camera;
- timeout, post-open replacement and second-call supersession without stale door actions;
- privacy-safe authorized-device management and the separately warned advanced FCM unregister path, including target refresh-chain behavior;
- physical-key capability, non-empty inventory, selected-key passage history and backend-verified rename;
- end-to-end enrollment of a genuinely unregistered physical key during the real 60-second `auto_collect/enable` window;
- real headless-FCM `reason=key_add` completion with the tested success rule (`key_status == 0` plus a parseable `key_id`), followed by healthy registered-key inventory;
- a separate no-key 60-second timeout in which no additional `reason=key_add` completion push was observed;
- repeated Lovelace reload/switch tests without reproducing the former **Configuration error**.

There are no remaining hard functional blockers under the published 0.31.0 scope. iOS actionable-notification delivery is not live-tested and is not claimed as Confirmed; physical-key deletion is deliberately unimplemented/out of scope; provider-specific enrollment failure payloads that were not observed are not inferred. Sanitized enrollment evidence is in `docs/api/key_enrollment_live_2026-09-09.md`; the former pre-release audit is retained only as a historical snapshot in `docs/releases/0.31.0-pre-release-audit.md`.

## Unofficial API documentation""",
          )
          rep("README.md", "validation-only **Add physical key**", "**Add physical key**")
          rep("README.md", "Add the main resource as a JavaScript module. On this 0.31.0 RC branch the matching cache-bust URL is:", "Add the main resource as a JavaScript module. For v0.31.0 the matching cache-bust URL is:")
          rep("README.md", "The `?v=` value must match the installed integration/card version. The currently published release remains v0.30.0 until separate merge/tag/GitHub Release approval.", "The `?v=` value must match the installed integration/card version.")
          rep("README.md", "The validation card contains six tabs:", "The card contains six tabs:")
          rep("README.md", "The KEYS tab and the validation authorized-device behavior are provided by packaged frontend extensions.", "The KEYS tab and the authorized-device behavior are provided by packaged frontend extensions.")
          rep("README.md", "complete current release-validation action lifecycle", "complete v0.31.0 validation action lifecycle")
          rep("README.md", "- **Physical keys** — numeric count; the validation branch also exposes read-only `keys` rows containing only `name` and UTC `created_at`;", "- **Physical keys** — numeric count plus read-only `keys` rows containing only `name` and UTC `created_at`;")
          rep("README.md", "The validation branch also adds **Add physical key** (`mdi:key-plus`) only for supported intercoms. It mirrors the Android-observed 60-second `auto_collect/enable` flow. A successful button request means only that enrollment mode was armed; the new key still has to be presented to the reader within 60 seconds. The real new-key side effect remains pending live validation.", "The integration exposes **Add physical key** (`mdi:key-plus`) only for supported intercoms. It mirrors the Android-observed 60-second `auto_collect/enable` flow. A successful button request means only that enrollment mode was armed; the new key still has to be presented to the reader within 60 seconds. End-to-end live testing confirmed that a genuinely unregistered key can then be registered successfully through this flow.")
          rep("README.md", "The FCM listener recognizes the Android-observed `reason=key_add` completion path. It refreshes the key inventory immediately and emits the account-level, privacy-minimized `ufanet_intercom_key_enrollment` event. Private provider identifiers, raw message text and push payload are not published. The real `key_add` path remains **Observed/pending live validation**.", "The FCM listener recognizes `reason=key_add`, refreshes the key inventory immediately and emits the account-level, privacy-minimized `ufanet_intercom_key_enrollment` event. The tested success path is **Confirmed** by a real new-key enrollment and headless-FCM completion. Private provider identifiers, raw message text and push payload are not published; unobserved provider-specific error payloads are not inferred.")

          rex(
              "README_RU.md",
              r"## Текущая validation-разработка / release candidate 0\.31\.0\n.*?\n## Неофициальная документация API",
              """## Текущий релиз: v0.31.0

Версия **v0.31.0** опубликована 9 сентября 2026 года после merge release candidate и успешных Tests, HACS/Hassfest и repository release self-check на финальном release commit. Тег релиза указывает на опубликованное состояние `main`.

Для релиза live-подтверждены:

- Android actionable notifications на реальных звонках Ufanet;
- защищённое **«Открыть дверь»** с фактическим открытием настроенной двери и **«Открыть камеру»** для выбранной same-device камеры;
- timeout, post-open replacement и supersession вторым звонком без устаревших door actions;
- privacy-safe управление авторизованными устройствами и отдельно предупреждённый advanced FCM unregister, включая проверенное влияние на refresh-chain target;
- capability, непустой inventory, selected-key история и backend-verified rename физических ключей;
- end-to-end регистрация действительно нового физического ключа в реальном 60-секундном окне `auto_collect/enable`;
- настоящий headless-FCM `reason=key_add` с подтверждённым success rule (`key_status == 0` и parseable `key_id`) и последующим корректным inventory;
- отдельный 60-секундный no-key timeout без дополнительного `reason=key_add` completion push;
- повторные Lovelace reload/switch проверки без воспроизведения прежней **Configuration error**.

В опубликованном scope 0.31.0 не осталось hard functional blockers. iOS actionable-notification delivery не проверялся live и не заявляется Confirmed; удаление физического ключа намеренно не реализовано и остаётся вне scope; не наблюдавшиеся provider-specific enrollment error payloads не додумываются. Обезличенное подтверждение enrollment находится в `docs/api/key_enrollment_live_2026-09-09.md`; прежний pre-release audit сохранён только как исторический snapshot в `docs/releases/0.31.0-pre-release-audit.md`.

## Неофициальная документация API""",
          )
          rep("README_RU.md", "validation-only **«Добавить физический ключ»**", "**«Добавить физический ключ»**")
          rep("README_RU.md", "Добавьте основной ресурс как JavaScript module. На текущей RC-ветке 0.31.0 правильный cache-bust URL:", "Добавьте основной ресурс как JavaScript module. Для v0.31.0 правильный cache-bust URL:")
          rep("README_RU.md", "`?v=` должен совпадать с реально установленной версией интеграции/карточки. Текущий опубликованный релиз остаётся v0.30.0 до отдельного разрешения на merge/tag/GitHub Release.", "`?v=` должен совпадать с реально установленной версией интеграции/карточки.")
          rep("README_RU.md", "В validation-ветке карточка содержит шесть вкладок:", "Карточка содержит шесть вкладок:")
          rep("README_RU.md", "Вкладка **КЛЮЧИ** и validation-логика управления устройствами реализованы packaged frontend extensions.", "Вкладка **КЛЮЧИ** и логика управления устройствами реализованы packaged frontend extensions.")
          rep("README_RU.md", "полном текущем release-validation action lifecycle", "полном validation lifecycle v0.31.0")
          rep("README_RU.md", "- **«Физические ключи»** — числовое количество; validation-ветка также публикует read-only `keys` только с `name` и UTC `created_at`;", "- **«Физические ключи»** — числовое количество и read-only `keys` только с `name` и UTC `created_at`;")
          rep("README_RU.md", "Validation-ветка добавляет **«Добавить физический ключ»** (`mdi:key-plus`) только для поддерживаемых домофонов. Кнопка повторяет Android-observed 60-секундный `auto_collect/enable` flow. Успешный HTTP означает только включение enrollment mode; новый ключ нужно физически приложить к считывателю в течение 60 секунд. Реальный new-key side effect пока ожидает live-проверки.", "Интеграция предоставляет **«Добавить физический ключ»** (`mdi:key-plus`) только для поддерживаемых домофонов. Кнопка повторяет Android-observed 60-секундный `auto_collect/enable` flow. Успешный HTTP означает только включение enrollment mode; новый ключ нужно физически приложить к считывателю в течение 60 секунд. End-to-end live-тест подтвердил успешную регистрацию действительно нового ключа через этот flow.")
          rep("README_RU.md", "FCM listener распознаёт Android-observed completion `reason=key_add`, немедленно обновляет key inventory и отправляет account-level privacy-minimized событие `ufanet_intercom_key_enrollment`. Private provider identifiers, raw message text и push payload не публикуются. Реальный `key_add` остаётся **Observed / pending live validation**.", "FCM listener распознаёт `reason=key_add`, немедленно обновляет key inventory и отправляет account-level privacy-minimized событие `ufanet_intercom_key_enrollment`. Проверенный success path имеет статус **Confirmed** после реальной регистрации нового ключа и headless-FCM completion. Private provider identifiers, raw message text и push payload не публикуются; не наблюдавшиеся provider-specific error payloads не додумываются.")

          # Publishing guide: preserve evergreen approval policy, replace obsolete RC state.
          rep("PUBLISHING.md", "This broader check is important for 0.31.0: validation introduced packaged KEYS/history and authorized-device extensions, so a stale extension cache-bust must fail release preparation rather than silently shipping an older browser resource.", "This broader check was introduced for 0.31.0 because that release added packaged KEYS/history and authorized-device extensions; a stale extension cache-bust must fail release preparation rather than silently shipping an older browser resource.")
          rex(
              "PUBLISHING.md",
              r"## Current 0\.31\.0 preparation state\n.*?\n## Live-validation gate",
              """## Published 0.31.0 baseline

Version **v0.31.0** was published on 2026-09-09 after the release candidate passed the required live-validation gates, privacy/documentation review and exact-head CI. The published scope includes actionable Android call notifications, authorized-device/advanced-FCM management, physical-key inventory/history/rename, and live-confirmed physical-key enrollment with real `reason=key_add` completion.

The release retained the documented boundaries: iOS actionable notification delivery is not claimed as live-confirmed; physical-key deletion is outside the 0.31.0 scope; unobserved provider-specific enrollment failure payloads are not inferred. Existing release tags remain immutable.

This baseline is historical context only. Future releases must repeat the same evidence, version-synchronization and explicit-approval process for their own target version and exact release SHA.

## Live-validation gate""",
          )
          rep("PUBLISHING.md", "The planned next minor version is **0.31.0**, subject to final confirmation at release time. Use a SemVer tag matching `manifest.json`, for example `v0.31.0`, and publish a GitHub Release rather than only creating a tag. An Unreleased planning heading or draft release notes are not authorization to publish.", "For every release, use a SemVer tag matching `manifest.json` (for example `v0.31.1` for a future patch release) and publish a GitHub Release rather than only creating a tag. The current published baseline is **v0.31.0**. An Unreleased planning heading or draft release notes are not authorization to publish.")

          # Changelog: shipped 0.31.0 functionality is no longer validation-only.
          rep("CHANGELOG.md", "- Added validation-only `list_physical_keys` and `rename_physical_key` response services.", "- Added `list_physical_keys` and `rename_physical_key` response services.")
          rep("CHANGELOG.md", "- Added a validation-only **КЛЮЧИ / KEYS** Lovelace tab as separate packaged frontend extensions.", "- Added a **КЛЮЧИ / KEYS** Lovelace tab as separate packaged frontend extensions.")

          # API overview pages: promote the already live-confirmed key enrollment path.
          rep("docs/api/README.md", "physical keys: confirmed capability/non-empty list/history, selected-key passage filtering and rename, plus validation-only enrollment/real FCM completion;", "physical keys: confirmed capability/non-empty list/history, selected-key passage filtering and rename, plus live-confirmed enrollment/real FCM completion;")
          rep("docs/api/README.md", "Confirmed `reason=sip` as the low-latency call signal and Observed `reason=key_add` as physical-key enrollment completion.", "Confirmed `reason=sip` as the low-latency call signal and Confirmed `reason=key_add` for the tested physical-key enrollment success path.")
          rep("docs/api/README.md", "confirmed non-empty inventory/history, private `external_id` history selection and controlled rename; validation-only enrollment/real FCM completion remains the release gate.", "confirmed non-empty inventory/history, private `external_id` history selection, controlled rename, and live-confirmed enrollment/real FCM completion.")
          rep("docs/api/README.md", "Physical-key rename is live-confirmed for the tested success path; enrollment/real `reason=key_add` and delete remain unconfirmed or out of scope as documented on the key reference page.", "Physical-key rename and enrollment/real `reason=key_add` are live-confirmed for the tested success path; delete remains unimplemented and outside the published 0.31.0 scope as documented on the key reference page.")

          rep("docs/api/README_RU.md", "Confirmed capability/непустой inventory/history физических ключей, selected-key фильтрация истории и rename, плюс validation-only enrollment/real FCM completion.", "Confirmed capability/непустой inventory/history физических ключей, selected-key фильтрация истории и rename, плюс live-confirmed enrollment/real FCM completion.")
          rep("docs/api/README_RU.md", "Confirmed непустой inventory/history, приватный `external_id` selector истории и controlled rename; validation-only enrollment/real FCM completion остаётся release gate.", "Confirmed непустой inventory/history, приватный `external_id` selector истории, controlled rename и live-confirmed enrollment/real FCM completion.")
          rep("docs/api/README_RU.md", "Rename физического ключа live-подтверждён для проверенного success path; enrollment/real `reason=key_add` и delete остаются неподтверждёнными или вне scope согласно подробной странице ключей.", "Rename и enrollment/real `reason=key_add` физического ключа live-подтверждены для проверенного success path; delete остаётся нереализованным и вне опубликованного scope 0.31.0 согласно подробной странице ключей.")

          # FCM detailed reference: key_add is Confirmed for the tested success path.
          rep("docs/api/fcm.md", "The official Android client also contains a physical-key enrollment completion path using `data.reason=key_add`, `key_status`, and `key_id`. That payload contract is currently **Observed** from client code and remains a hard live-validation gate until a new unregistered physical key can be enrolled end to end.", "The official Android client contains a physical-key enrollment completion path using `data.reason=key_add`, `key_status`, and `key_id`. On 2026-09-09 that success path was exercised end to end with a genuinely unregistered key and a real headless-FCM completion, so `reason=key_add` is **Confirmed for the tested success path**.")
          rep("docs/api/fcm.md", "The current validation branch additionally recognizes `data.reason=key_add`.", "The current integration recognizes `data.reason=key_add`.")
          rep("docs/api/fcm.md", "The validation branch separates normal device authorization from advanced FCM cleanup:", "The current integration separates normal device authorization from advanced FCM cleanup:")
          rep("docs/api/fcm.md", "**Observed in the Android client; live validation pending**", "**Confirmed for the tested success path**")
          rep("docs/api/fcm.md", "The validation branch handles this message without exposing provider identifiers:", "The integration handles this message without exposing provider identifiers:")
          rex(
              "docs/api/fcm.md",
              r"## Required key-add live validation\n.*?\n## Security",
              """## Physical-key completion live validation

On 2026-09-09 the physical-key completion path was confirmed end to end:

1. Home Assistant armed the real 60-second enrollment window through `auto_collect/enable`;
