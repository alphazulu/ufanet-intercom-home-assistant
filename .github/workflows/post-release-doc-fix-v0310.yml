name: Post-release documentation synchronization

on:
  push:
    branches:
      - codex/post-release-audit-v0.31.0
    paths:
      - .github/workflows/post-release-doc-fix-v0310.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Apply post-release documentation synchronization
        run: python scripts/post_release_doc_sync_v0310.py

      - name: Validate and commit documentation-only result
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No documentation changes produced"; exit 1; }
          git commit -m "Synchronize documentation after v0.31.0 release"
          git push origin HEAD:codex/post-release-audit-v0.31.0
