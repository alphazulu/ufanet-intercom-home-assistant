3. the active headless listener received real `reason=key_add` completion pushes;
4. the tested success matched `key_status == 0` plus a parseable `key_id`;
5. the immediate key-inventory refresh remained healthy and the registered key was present.

A separate no-key test allowed the complete 60-second window to expire and produced no additional `reason=key_add` completion push. No HTTP 400, `key_status != 0`, or separate FCM error completion was observed in that case, so those provider-specific error semantics remain uncharacterized rather than inferred.

Sanitized evidence is recorded in `key_enrollment_live_2026-09-09.md`.

## Security""",
          )

          rep("docs/api/fcm_RU.md", "Официальный Android-клиент также содержит completion flow регистрации физического ключа с `data.reason=key_add`, `key_status` и `key_id`. Этот контракт пока имеет статус **Observed** по коду клиента и остаётся обязательным live-gate до end-to-end регистрации нового незарегистрированного ключа.", "Официальный Android-клиент содержит completion flow регистрации физического ключа с `data.reason=key_add`, `key_status` и `key_id`. 9 сентября 2026 года этот success path был проверен end-to-end с действительно новым ключом и реальным headless-FCM completion, поэтому `reason=key_add` имеет статус **Confirmed для проверенного success path**.")
          rep("docs/api/fcm_RU.md", "Текущая validation-ветка дополнительно распознаёт `data.reason=key_add`.", "Текущая интеграция распознаёт `data.reason=key_add`.")
          rep("docs/api/fcm_RU.md", "Validation-ветка разделяет обычный отзыв авторизации и advanced FCM cleanup:", "Текущая интеграция разделяет обычный отзыв авторизации и advanced FCM cleanup:")
          rep("docs/api/fcm_RU.md", "**Observed в Android-клиенте; live-проверка ожидается**", "**Confirmed для проверенного success path**")
          rep("docs/api/fcm_RU.md", "Validation-ветка обрабатывает сообщение без provider identifiers:", "Интеграция обрабатывает сообщение без provider identifiers:")
          rex(
