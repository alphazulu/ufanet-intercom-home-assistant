name: Harden call history response

on:
  push:
    paths:
      - .github/workflows/harden-call-history.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Harden call-history response validation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("custom_components/ufanet_intercom/api.py")
          text = path.read_text(encoding="utf-8")
          old = '        if isinstance(data, dict):\n            results = data.get("results", [])\n            if isinstance(results, list):\n                return [item for item in results if isinstance(item, dict)]\n'
          new = '        if isinstance(data, dict) and "results" in data:\n            results = data["results"]\n            if isinstance(results, list):\n                return [item for item in results if isinstance(item, dict)]\n'
          if old not in text:
              raise SystemExit("Expected call-history block not found; refusing to patch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit hardened validation and remove temporary workflow
        run: |
          rm .github/workflows/harden-call-history.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/ufanet_intercom/api.py .github/workflows/harden-call-history.yml
          git commit -m "Harden call history response validation"
          git push origin HEAD:main
