name: Ready PR #9 once

on:
  push:
    branches:
      - codex/fcm-authorized-devices-audit
    paths:
      - .github/workflows/ready-pr9-once.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR #9 ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 9 --repo alphazulu/ufanet-intercom-home-assistant
