name: Patch authorized OS audit

on:
  push:
    branches:
      - codex/fcm-authorized-devices-audit
    paths:
      - .github/workflows/patch-authorized-os-audit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fcm-authorized-devices-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply privacy-safe OS metadata audit
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, got {count}")
              return text.replace(old, new, 1)

          probe_path = Path("tools/research/fcm_probe_py/probe.py")
          text = probe_path.read_text(encoding="utf-8")
          if '"os_code_counts"' in text:
              raise SystemExit("probe.py already contains OS aggregation")

          old = (
              'EXPECTED_AUTHORIZED_DEVICE_FIELDS = {\n'
              '    "device_id",\n'
              '    "title",\n'
              '    "last_update",\n'
              '    "is_call_access",\n'
              '}\n'
          )
          new = (
              'EXPECTED_AUTHORIZED_DEVICE_FIELDS = {\n'
              '    "device_id",\n'
              '    "title",\n'
              '    "last_update",\n'
              '    "is_call_access",\n'
              '    "os",\n'
              '    "os_display",\n'
              '}\n\n\n'
              'def _normalize_authorized_os_code(value: Any) -> str | None:\n'
              '    """Return a bounded opaque OS code without assigning platform semantics."""\n'
              '    if type(value) is not int or not 0 <= value <= 255:\n'
              '        return None\n'
              '    return str(value)\n\n\n'
              'def _normalize_authorized_os_display(value: Any) -> str | None:\n'
              '    """Reduce provider OS display text to a fixed privacy-safe category."""\n'
              '    if not isinstance(value, str):\n'
              '        return None\n'
              '    stripped = value.strip()\n'
              '    if not stripped or len(stripped) > 64:\n'
              '        return None\n'
              '    if any(ord(char) < 32 or ord(char) == 127 for char in stripped):\n'
              '        return None\n'
              '    normalized = stripped.casefold()\n'
              '    if "android" in normalized:\n'
              '        return "android"\n'
              '    if (\n'
              '        normalized == "ios"\n'
              '        or normalized.startswith("ios ")\n'
              '        or "iphone" in normalized\n'
              '        or "ipad" in normalized\n'
              '    ):\n'
              '        return "ios"\n'
              '    if "harmony" in normalized:\n'
              '        return "harmonyos"\n'
              '    return "other"\n'
          )
          text = replace_once(text, old, new, "expected fields")

          old = (
              '    call_access_false = 0\n'
              '    call_access_invalid = 0\n'
              '    unknown_fields: set[str] = set()\n'
          )
          new = (
              '    call_access_false = 0\n'
              '    call_access_invalid = 0\n'
              '    with_os = 0\n'
              '    os_code_invalid = 0\n'
              '    os_code_counts: dict[str, int] = {}\n'
              '    with_os_display = 0\n'
              '    os_display_invalid = 0\n'
              '    os_display_counts: dict[str, int] = {}\n'
              '    os_code_display_pairs: dict[tuple[str, str], int] = {}\n'
              '    unknown_fields: set[str] = set()\n'
          )
          text = replace_once(text, old, new, "counters")

          anchor = '        if "is_call_access" in item:\n'
          os_block = (
              '        os_code: str | None = None\n'
              '        os_value = item.get("os", ...)\n'
              '        if os_value is not ...:\n'
              '            with_os += 1\n'
              '            os_code = _normalize_authorized_os_code(os_value)\n'
              '            if os_code is None:\n'
              '                os_code_invalid += 1\n'
              '            else:\n'
              '                os_code_counts[os_code] = os_code_counts.get(os_code, 0) + 1\n\n'
              '        os_display_category: str | None = None\n'
              '        os_display_value = item.get("os_display", ...)\n'
              '        if os_display_value is not ...:\n'
              '            with_os_display += 1\n'
              '            os_display_category = _normalize_authorized_os_display(os_display_value)\n'
              '            if os_display_category is None:\n'
              '                os_display_invalid += 1\n'
              '            else:\n'
              '                os_display_counts[os_display_category] = (\n'
              '                    os_display_counts.get(os_display_category, 0) + 1\n'
              '                )\n\n'
              '        if os_code is not None and os_display_category is not None:\n'
              '            pair = (os_code, os_display_category)\n'
              '            os_code_display_pairs[pair] = os_code_display_pairs.get(pair, 0) + 1\n\n'
          )
          text = replace_once(text, anchor, os_block + anchor, "per-record OS audit")

          old = (
              '        "call_access_false": call_access_false,\n'
              '        "call_access_invalid": call_access_invalid,\n'
              '        "unknown_field_count": len(unknown_fields),\n'
          )
          new = (
              '        "call_access_false": call_access_false,\n'
              '        "call_access_invalid": call_access_invalid,\n'
              '        "with_os": with_os,\n'
              '        "os_code_invalid": os_code_invalid,\n'
              '        "os_code_counts": tuple(\n'
              '            f"{code}={count}" for code, count in sorted(os_code_counts.items())\n'
              '        ),\n'
              '        "with_os_display": with_os_display,\n'
              '        "os_display_invalid": os_display_invalid,\n'
              '        "os_display_counts": tuple(\n'
              '            f"{category}={count}"\n'
              '            for category, count in sorted(os_display_counts.items())\n'
              '        ),\n'
              '        "os_code_display_pairs": tuple(\n'
              '            f"{code}->{category}={count}"\n'
              '            for (code, category), count in sorted(os_code_display_pairs.items())\n'
              '        ),\n'
              '        "unknown_field_count": len(unknown_fields),\n'
          )
          text = replace_once(text, old, new, "summary")

          old = (
              '        "call_access_false",\n'
              '        "call_access_invalid",\n'
              '        "unknown_field_count",\n'
              '    ):\n'
              '        print(f"  {key}: {summary[key]}")\n'
              '    unknown_names = summary["unknown_field_names"]\n'
          )
          new = (
              '        "call_access_false",\n'
              '        "call_access_invalid",\n'
              '        "with_os",\n'
              '        "os_code_invalid",\n'
              '        "with_os_display",\n'
              '        "os_display_invalid",\n'
              '        "unknown_field_count",\n'
              '    ):\n'
              '        print(f"  {key}: {summary[key]}")\n'
              '    for aggregate_key in (\n'
              '        "os_code_counts",\n'
              '        "os_display_counts",\n'
              '        "os_code_display_pairs",\n'
              '    ):\n'
              '        values = summary[aggregate_key]\n'
              '        print(f"  {aggregate_key}: " + (", ".join(values) if values else "(none)"))\n'
              '    unknown_names = summary["unknown_field_names"]\n'
          )
          text = replace_once(text, old, new, "printer")
          probe_path.write_text(text, encoding="utf-8", newline="\n")

          test_path = Path("tests/test_fcm_probe.py")
          tests = test_path.read_text(encoding="utf-8")
          old = (
              '        "call_access_false": 1,\n'
              '        "call_access_invalid": 0,\n'
              '        "unknown_field_count": 1,\n'
          )
          new = (
              '        "call_access_false": 1,\n'
              '        "call_access_invalid": 0,\n'
              '        "with_os": 0,\n'
              '        "os_code_invalid": 0,\n'
              '        "os_code_counts": (),\n'
              '        "with_os_display": 0,\n'
              '        "os_display_invalid": 0,\n'
              '        "os_display_counts": (),\n'
              '        "os_code_display_pairs": (),\n'
              '        "unknown_field_count": 1,\n'
          )
          tests = replace_once(tests, old, new, "expected audit summary")

          anchor = 'def test_authorized_devices_summary_rejects_unknown_envelope_without_values() -> None:\n'
          addition = '''def test_authorized_devices_os_metadata_is_bounded_and_privacy_safe() -> None:
              secret_display = "private-provider-platform-value"
              payload = {
                  "data": {
                      "device_list": [
                          {"os": 0, "os_display": "Android"},
                          {"os": 1, "os_display": "iOS"},
                          {"os": 0, "os_display": "Android 15"},
                          {"os": 255, "os_display": secret_display},
                          {"os": 256, "os_display": 123},
                          {"os": "0", "os_display": "secret\\nvalue"},
                      ],
                      "devices_num_permission": False,
                  }
              }

              summary = probe.summarize_authorized_devices(
                  payload,
                  now=datetime(2026, 9, 2, 16, 0, tzinfo=timezone.utc),
              )

              assert summary["with_os"] == 6
              assert summary["os_code_invalid"] == 2
              assert summary["os_code_counts"] == ("0=2", "1=1", "255=1")
              assert summary["with_os_display"] == 6
              assert summary["os_display_invalid"] == 2
              assert summary["os_display_counts"] == (
                  "android=2",
                  "ios=1",
                  "other=1",
              )
              assert summary["os_code_display_pairs"] == (
                  "0->android=2",
                  "1->ios=1",
                  "255->other=1",
              )
              assert summary["unknown_field_count"] == 0
              assert secret_display not in repr(summary)
              assert "secret\\nvalue" not in repr(summary)


          '''
          tests = replace_once(tests, anchor, addition + anchor, "OS privacy test")
          test_path.write_text(tests, encoding="utf-8", newline="\n")

          readme_path = Path("tools/research/fcm_probe_py/README_RU.md")
          readme = readme_path.read_text(encoding="utf-8")
          marker = 'Пример безопасного вывода:\n'
          note = '''Live-аудит 2 сентября 2026 года также подтвердил наличие полей `os` и
          `os_display`. Числовая семантика `os` пока не считается подтверждённой: probe
          выводит его только как ограниченный непрозрачный код `0..255`. `os_display`
          сводится к фиксированным категориям `android`, `ios`, `harmonyos`, `other`.
          Исходная строка `os_display` не печатается; допустимы только агрегированные
          счётчики и корреляция `код -> категория`. `devices_num_permission` также
          наблюдается live, но его точная бизнес-семантика пока не утверждается.

          '''
          readme = replace_once(readme, marker, note + marker, "README OS note")
          old = (
              '  call_access_false: 1\n'
              '  call_access_invalid: 0\n'
              '  unknown_field_count: 2\n'
              '  unknown_field_names: <schema_field_1>, <schema_field_2>\n'
          )
          new = (
              '  call_access_false: 1\n'
              '  call_access_invalid: 0\n'
              '  with_os: 3\n'
              '  os_code_invalid: 0\n'
              '  with_os_display: 3\n'
              '  os_display_invalid: 0\n'
              '  unknown_field_count: 0\n'
              '  os_code_counts: 0=2, 1=1\n'
              '  os_display_counts: android=2, ios=1\n'
              '  os_code_display_pairs: 0->android=2, 1->ios=1\n'
              '  unknown_field_names: (none)\n'
          )
          readme = replace_once(readme, old, new, "README example")
          readme_path.write_text(readme, encoding="utf-8", newline="\n")
      - name: Compile and run focused tests
        run: |
          python -m py_compile tools/research/fcm_probe_py/probe.py
          python -m pip install -r requirements_test.txt
          pytest -q tests/test_fcm_probe.py
      - name: Commit useful patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/research/fcm_probe_py/probe.py tests/test_fcm_probe.py tools/research/fcm_probe_py/README_RU.md
          git diff --cached --check
          git commit -m "Audit authorized-device OS metadata safely"
          git push origin HEAD:codex/fcm-authorized-devices-audit
