name: Patch authorized OS audit

on:
  push:
    branches:
      - codex/fcm-authorized-devices-audit
    paths:
      - .github/workflows/patch-authorized-os-audit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fcm-authorized-devices-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply privacy-safe OS metadata audit
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, got {count}")
              return text.replace(old, new)

          probe_path = Path("tools/research/fcm_probe_py/probe.py")
          text = probe_path.read_text(encoding="utf-8")
          if '"os_code_counts"' in text:
              raise SystemExit("probe.py already contains OS aggregation; refusing duplicate patch")

          old = '''EXPECTED_AUTHORIZED_DEVICE_FIELDS = {
              "device_id",
              "title",
              "last_update",
              "is_call_access",
          }
          '''
          new = '''EXPECTED_AUTHORIZED_DEVICE_FIELDS = {
              "device_id",
              "title",
              "last_update",
              "is_call_access",
              "os",
              "os_display",
          }


          def _normalize_authorized_os_code(value: Any) -> str | None:
              """Return a bounded opaque OS code without assigning platform semantics."""
              if type(value) is not int or not 0 <= value <= 255:
                  return None
              return str(value)


          def _normalize_authorized_os_display(value: Any) -> str | None:
              """Reduce provider OS display text to a fixed privacy-safe category."""
              if not isinstance(value, str):
                  return None
              stripped = value.strip()
              if not stripped or len(stripped) > 64:
                  return None
              if any(ord(char) < 32 or ord(char) == 127 for char in stripped):
                  return None

              normalized = stripped.casefold()
              if "android" in normalized:
                  return "android"
              if (
                  normalized == "ios"
                  or normalized.startswith("ios ")
                  or "iphone" in normalized
                  or "ipad" in normalized
              ):
                  return "ios"
              if "harmony" in normalized:
                  return "harmonyos"
              return "other"
          '''
          text = replace_once(text, old, new, "expected fields")

          old = '''    call_access_false = 0
              call_access_invalid = 0
              unknown_fields: set[str] = set()
          '''
          new = '''    call_access_false = 0
              call_access_invalid = 0
              with_os = 0
              os_code_invalid = 0
              os_code_counts: dict[str, int] = {}
              with_os_display = 0
              os_display_invalid = 0
              os_display_counts: dict[str, int] = {}
              os_code_display_pairs: dict[tuple[str, str], int] = {}
              unknown_fields: set[str] = set()
          '''
          text = replace_once(text, old, new, "counters")

          old = '''        if "is_call_access" in item:
                  with_call_access += 1
                  call_access = item.get("is_call_access")
                  if call_access is True:
                      call_access_true += 1
                  elif call_access is False:
                      call_access_false += 1
                  else:
                      call_access_invalid += 1
          '''
          new = '''        os_code: str | None = None
              os_value = item.get("os", ...)
              if os_value is not ...:
                  with_os += 1
                  os_code = _normalize_authorized_os_code(os_value)
                  if os_code is None:
                      os_code_invalid += 1
                  else:
                      os_code_counts[os_code] = os_code_counts.get(os_code, 0) + 1

              os_display_category: str | None = None
              os_display_value = item.get("os_display", ...)
              if os_display_value is not ...:
                  with_os_display += 1
                  os_display_category = _normalize_authorized_os_display(os_display_value)
                  if os_display_category is None:
                      os_display_invalid += 1
                  else:
                      os_display_counts[os_display_category] = (
                          os_display_counts.get(os_display_category, 0) + 1
                      )

              if os_code is not None and os_display_category is not None:
                  pair = (os_code, os_display_category)
                  os_code_display_pairs[pair] = os_code_display_pairs.get(pair, 0) + 1

              if "is_call_access" in item:
                  with_call_access += 1
                  call_access = item.get("is_call_access")
                  if call_access is True:
                      call_access_true += 1
                  elif call_access is False:
                      call_access_false += 1
                  else:
                      call_access_invalid += 1
          '''
          text = replace_once(text, old, new, "per-record audit")

          old = '''        "call_access_false": call_access_false,
              "call_access_invalid": call_access_invalid,
              "unknown_field_count": len(unknown_fields),
          '''
          new = '''        "call_access_false": call_access_false,
              "call_access_invalid": call_access_invalid,
              "with_os": with_os,
              "os_code_invalid": os_code_invalid,
              "os_code_counts": tuple(
                  f"{code}={count}" for code, count in sorted(os_code_counts.items())
              ),
              "with_os_display": with_os_display,
              "os_display_invalid": os_display_invalid,
              "os_display_counts": tuple(
                  f"{category}={count}"
                  for category, count in sorted(os_display_counts.items())
              ),
              "os_code_display_pairs": tuple(
                  f"{code}->{category}={count}"
                  for (code, category), count in sorted(os_code_display_pairs.items())
              ),
              "unknown_field_count": len(unknown_fields),
          '''
          text = replace_once(text, old, new, "summary")

          old = '''        "call_access_true",
              "call_access_false",
              "call_access_invalid",
              "unknown_field_count",
          ):
              print(f"  {key}: {summary[key]}")
              unknown_names = summary["unknown_field_names"]
          '''
          new = '''        "call_access_true",
              "call_access_false",
              "call_access_invalid",
              "with_os",
              "os_code_invalid",
              "with_os_display",
              "os_display_invalid",
              "unknown_field_count",
          ):
              print(f"  {key}: {summary[key]}")
              for aggregate_key in (
                  "os_code_counts",
                  "os_display_counts",
                  "os_code_display_pairs",
              ):
                  values = summary[aggregate_key]
                  print(
                      f"  {aggregate_key}: "
                      + (", ".join(values) if values else "(none)")
                  )
              unknown_names = summary["unknown_field_names"]
          '''
          text = replace_once(text, old, new, "printer")
          probe_path.write_text(text, encoding="utf-8", newline="\n")

          test_path = Path("tests/test_fcm_probe.py")
          tests = test_path.read_text(encoding="utf-8")
          old = '''        "call_access_false": 1,
              "call_access_invalid": 0,
              "unknown_field_count": 1,
          '''
          new = '''        "call_access_false": 1,
              "call_access_invalid": 0,
              "with_os": 0,
              "os_code_invalid": 0,
              "os_code_counts": (),
              "with_os_display": 0,
              "os_display_invalid": 0,
              "os_display_counts": (),
              "os_code_display_pairs": (),
              "unknown_field_count": 1,
          '''
          tests = replace_once(tests, old, new, "expected summary")

          anchor = '''def test_authorized_devices_summary_rejects_unknown_envelope_without_values() -> None:
          '''
          addition = '''def test_authorized_devices_os_metadata_is_bounded_and_privacy_safe() -> None:
              secret_display = "private-provider-platform-value"
              payload = {
                  "data": {
                      "device_list": [
                          {"os": 0, "os_display": "Android"},
                          {"os": 1, "os_display": "iOS"},
                          {"os": 0, "os_display": "Android 15"},
                          {"os": 255, "os_display": secret_display},
                          {"os": 256, "os_display": 123},
                          {"os": "0", "os_display": "secret\\nvalue"},
                      ],
                      "devices_num_permission": False,
                  }
              }

              summary = probe.summarize_authorized_devices(
                  payload,
                  now=datetime(2026, 9, 2, 16, 0, tzinfo=timezone.utc),
              )

              assert summary["with_os"] == 6
              assert summary["os_code_invalid"] == 2
              assert summary["os_code_counts"] == ("0=2", "1=1", "255=1")
              assert summary["with_os_display"] == 6
              assert summary["os_display_invalid"] == 2
              assert summary["os_display_counts"] == (
                  "android=2",
                  "ios=1",
                  "other=1",
              )
              assert summary["os_code_display_pairs"] == (
                  "0->android=2",
                  "1->ios=1",
                  "255->other=1",
              )
              assert summary["unknown_field_count"] == 0
              assert secret_display not in repr(summary)
              assert "secret\\nvalue" not in repr(summary)


          ''' + anchor
          tests = replace_once(tests, anchor, addition, "OS metadata test")
          test_path.write_text(tests, encoding="utf-8", newline="\n")

          readme_path = Path("tools/research/fcm_probe_py/README_RU.md")
          readme = readme_path.read_text(encoding="utf-8")
          old = '''Возраст `last_update` выводится только корзинами `<=24h`, `1-7d`, `7-30d`, `30-90d`,
          `>90d`; отдельный `future`-счётчик позволяет заметить рассинхронизацию часов без
          публикации точной даты.
          '''
          new = old + '''
          Live-аудит 2 сентября 2026 года также подтвердил наличие полей `os` и
          `os_display`. Их наличие считается подтверждённой частью wire-schema, но
          числовая семантика `os` пока не подтверждена. Android-клиент при регистрации
          отправляет `os: 0`, однако его DTO активных авторизаций не использует эти поля,
          поэтому probe намеренно не зашивает таблицу вида `0 = Android`.

          Для дальнейшего исследования `os` выводится только как ограниченный непрозрачный
          числовой код `0..255`, а `os_display` сводится к фиксированным категориям
          `android`, `ios`, `harmonyos`, `other`. Probe может показать только агрегированные
          счётчики и корреляцию `код -> категория`; исходная строка `os_display`, название
          устройства и идентификатор устройства в вывод не попадают.

          `devices_num_permission` также наблюдается live. Его точная бизнес-семантика пока
          не считается подтверждённой: декомпилированная модель содержит близкое по смыслу
          поле ограничения количества устройств, но текущий экран активных устройств не
          использует его для поведения интерфейса.
          '''
          readme = replace_once(readme, old, new, "README OS notes")

          old = '''  call_access_false: 1
            call_access_invalid: 0
            unknown_field_count: 2
          '''
          new = '''  call_access_false: 1
            call_access_invalid: 0
            with_os: 3
            os_code_invalid: 0
            with_os_display: 3
            os_display_invalid: 0
            unknown_field_count: 0
            os_code_counts: 0=2, 1=1
            os_display_counts: android=2, ios=1
            os_code_display_pairs: 0->android=2, 1->ios=1
          '''
          readme = replace_once(readme, old, new, "README example")
          old = '''  unknown_field_names: <schema_field_1>, <schema_field_2>
          '''
          new = '''  unknown_field_names: (none)
          '''
          readme = replace_once(readme, old, new, "README unknown fields example")
          readme_path.write_text(readme, encoding="utf-8", newline="\n")
      - name: Compile and run focused tests
        run: |
          python -m py_compile tools/research/fcm_probe_py/probe.py
          python -m pip install -r requirements_test.txt
          pytest -q tests/test_fcm_probe.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/research/fcm_probe_py/probe.py tests/test_fcm_probe.py tools/research/fcm_probe_py/README_RU.md
          git diff --cached --check
          git commit -m "Audit authorized-device OS metadata safely"
          git push origin HEAD:codex/fcm-authorized-devices-audit
