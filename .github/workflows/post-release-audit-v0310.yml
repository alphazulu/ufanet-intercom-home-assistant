name: Post-release documentation audit

on:
  push:
    branches:
      - codex/post-release-audit-v0.31.0
    paths:
      - .github/workflows/post-release-audit-v0310.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Scan repository documentation and release state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import unquote

          ROOT = Path.cwd()
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          tracked = [Path(p) for p in tracked if p]
          text_suffixes = {".md", ".yml", ".yaml", ".json", ".py", ".js", ".toml"}

          stale_patterns = [
              "Current validation / 0.31.0 release candidate",
              "Текущая validation-разработка / release candidate 0.31.0",
              "draft/open/unmerged",
              "currently published GitHub/HACS release remains **v0.30.0**",
              "Текущий опубликованный GitHub/HACS релиз остаётся **v0.30.0**",
              "currently published release remains v0.30.0",
              "Текущий опубликованный релиз остаётся v0.30.0",
              "real new-key side effect remains pending live validation",
              "Реальный new-key side effect пока ожидает live-проверки",
              "real `key_add` path remains **Observed/pending live validation**",
              "Реальный `key_add` остаётся **Observed / pending live validation**",
              "Observed in the Android client; live validation pending",
              "Observed в Android-клиенте; live-проверка ожидается",
              "Required key-add live validation",
              "planned next minor version is **0.31.0**",
              "validation branch",
              "validation-branch",
              "validation branch",
              "validation-ветка",
              "Validation-ветка",
              "combined validation branch",
              "combined validation branch",
          ]

          print("=== STALE / RC WORDING SCAN ===")
          stale_hits = []
          for rel in tracked:
              if rel.suffix.lower() not in text_suffixes:
                  continue
              try:
                  lines = (ROOT / rel).read_text(encoding="utf-8").splitlines()
              except UnicodeDecodeError:
                  continue
              for lineno, line in enumerate(lines, 1):
                  low = line.lower()
                  if any(p.lower() in low for p in stale_patterns):
                      stale_hits.append((str(rel), lineno, line.strip()))
          for hit in stale_hits:
              print(f"{hit[0]}:{hit[1]}: {hit[2]}")
          print(f"STALE_HIT_COUNT={len(stale_hits)}")

          print("\n=== MARKDOWN LOCAL LINK CHECK ===")
          link_re = re.compile(r"!?\[[^\]]*\]\(([^)]+)\)")
          broken = []
          checked = 0
          for rel in tracked:
              if rel.suffix.lower() != ".md":
                  continue
              text = (ROOT / rel).read_text(encoding="utf-8")
              for raw in link_re.findall(text):
                  target = raw.strip().split()[0].strip("<>")
                  if not target or target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  target = unquote(target.split("#", 1)[0].split("?", 1)[0])
                  if not target or target.startswith("/"):
                      continue
                  checked += 1
                  resolved = (ROOT / rel.parent / target).resolve()
                  try:
                      resolved.relative_to(ROOT.resolve())
                  except ValueError:
                      broken.append((str(rel), raw, "escapes repository"))
                      continue
                  if not resolved.exists():
                      broken.append((str(rel), raw, "missing"))
          print(f"LOCAL_LINKS_CHECKED={checked}")
          for item in broken:
              print(f"BROKEN_LINK {item[0]} -> {item[1]} ({item[2]})")
          print(f"BROKEN_LINK_COUNT={len(broken)}")

          print("\n=== RELEASE VERSION CONSISTENCY ===")
          manifest = json.loads((ROOT / "custom_components/ufanet_intercom/manifest.json").read_text())
          version = manifest["version"]
          checks = {
              "manifest": version,
              "const": re.search(r'^INTEGRATION_VERSION = "([^"]+)"', (ROOT / "custom_components/ufanet_intercom/const.py").read_text(), re.M).group(1),
              "card": re.search(r'^const CARD_VERSION = "([^"]+)"', (ROOT / "custom_components/ufanet_intercom/frontend/ufanet-archive-card.js").read_text(), re.M).group(1),
          }
          init_text = (ROOT / "custom_components/ufanet_intercom/__init__.py").read_text()
          auth_text = (ROOT / "custom_components/ufanet_intercom/authorized_devices.py").read_text()
          for name, text in {
              "archive cache": init_text,
              "physical keys cache": init_text,
              "key history cache": init_text,
              "authorized devices cache": auth_text,
              "README": (ROOT / "README.md").read_text(),
              "README_RU": (ROOT / "README_RU.md").read_text(),
          }.items():
              ok = f"?v={version}" in text
              print(f"{name}: {'OK' if ok else 'MISSING'} {version}")
              if not ok:
                  raise SystemExit(f"release version/cache-bust mismatch: {name}")
          if len(set(checks.values())) != 1:
              raise SystemExit(f"release version mismatch: {checks}")
          print(f"VERSION={version}; core versions synchronized")

          if broken:
              raise SystemExit("broken local Markdown links found")
          PY
