name: Patch FCM session security controls

on:
  push:
    branches:
      - codex/fcm-session-security

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fcm-session-security

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt

      - name: Apply production patch
        run: python tools/research/apply_fcm_session_security_patch.py

      - name: Validate patch
        run: |
          python -m py_compile custom_components/ufanet_intercom/api.py custom_components/ufanet_intercom/fcm.py custom_components/ufanet_intercom/fcm_sessions.py custom_components/ufanet_intercom/services.py tools/research/fcm_probe_py/probe.py
          pytest -q tests/test_api_extended.py tests/test_fcm_sessions.py tests/test_fcm_session_services.py tests/test_fcm.py
          pytest -q

      - name: Commit production controls and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-fcm-session-security.yml tools/research/apply_fcm_session_security_patch.py
          git add custom_components/ufanet_intercom/api.py custom_components/ufanet_intercom/fcm.py custom_components/ufanet_intercom/fcm_sessions.py custom_components/ufanet_intercom/const.py custom_components/ufanet_intercom/services.py custom_components/ufanet_intercom/services.yaml tests/test_api_extended.py tests/test_fcm_sessions.py tests/test_fcm_session_services.py
          git commit -m "Add protected FCM session revocation controls"
          git push origin HEAD:codex/fcm-session-security
