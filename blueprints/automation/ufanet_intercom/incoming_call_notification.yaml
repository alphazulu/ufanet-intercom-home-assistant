blueprint:
  name: Ufanet incoming call notification
  description: >-
    Send an immediate Home Assistant Companion notification for a confirmed
    Ufanet intercom call, then replace it with the privately proxied last-call
    image when the JPEG becomes ready. An optional, time-limited Open door
    action can target an explicitly selected Ufanet button. Manual runs are
    safe tests: they fall back to the last-call sensor and never enable the
    door action.
  domain: automation
  source_url: >-
    https://github.com/alphazulu/ufanet-intercom-home-assistant/blob/main/blueprints/automation/ufanet_intercom/incoming_call_notification.yaml
  author: alphazulu
  homeassistant:
    min_version: 2026.8.0
  input:
    intercom_device:
      name: Ufanet intercom
      selector:
        device:
          filter:
            integration: ufanet_intercom
    notify_device:
      name: Phone to notify
      description: Device running the official Home Assistant Companion app.
      selector:
        device:
          filter:
            integration: mobile_app
    last_call_sensor:
      name: Last call sensor
      description: >-
        Optional but recommended. Select the Last call timestamp sensor from
        the same intercom. It supplies safe fallback metadata for manual tests.
      default: ""
      selector:
        entity:
          filter:
            domain: sensor
            integration: ufanet_intercom
    last_call_image:
      name: Last call image
      description: Select the image entity belonging to the same intercom.
      selector:
        entity:
          filter:
            domain: image
            integration: ufanet_intercom
    open_door_button:
      name: Open door button
      description: >-
        Optional. Select the exact Ufanet relay button that may be pressed from
        a real incoming-call notification. The button must belong to the same
        Home Assistant device as the selected intercom. Manual runs never
        expose this action.
      default: ""
      selector:
        entity:
          filter:
            domain: button
            integration: ufanet_intercom
    image_delay:
      name: Image wait timeout
      description: >-
        Maximum time after the call starts in which a newly prepared private
        JPEG may replace the first notification. The first push is never delayed
        by image generation.
      default: 15
      selector:
        number:
          min: 0
          max: 30
          step: 1
          unit_of_measurement: seconds
          mode: slider
    action_timeout:
      name: Door action timeout
      description: >-
        How long the unique Open door notification action remains accepted.
        After the timeout the notification is replaced without that action.
      default: 120
      selector:
        number:
          min: 15
          max: 600
          step: 15
          unit_of_measurement: seconds
          mode: slider
    dashboard_uri:
      name: Home Assistant view
      description: Relative Home Assistant path opened by the View camera action.
      default: /lovelace/0
      selector:
        text:
    notification_title:
      name: Notification title
      default: Incoming intercom call
      selector:
        text:
    notification_message:
      name: Notification message
      default: Someone is calling the intercom.
      selector:
        text:

variables:
  intercom_device_id: !input intercom_device
  last_call_sensor_entity: !input last_call_sensor
  last_call_image_entity: !input last_call_image
  open_door_button_entity: !input open_door_button
  image_delay_value: !input image_delay
  dashboard_uri_value: !input dashboard_uri
  notification_title_value: !input notification_title
  notification_message_value: !input notification_message
  run_started_ts: "{{ as_timestamp(now()) }}"
  is_live_call: >-
    {{ trigger is defined
       and trigger.event is defined
       and trigger.event.data is defined }}
  event_data: >-
    {{ trigger.event.data
       if is_live_call
       else dict() }}
  run_id: >-
    {{ trigger.event.context.id
       if is_live_call
       else now().strftime('%Y%m%d%H%M%S%f') }}
  call_time: >-
    {{ event_data.called_at
       | default(states(last_call_sensor_entity), true)
       | default('', true) }}
  call_address: >-
    {% set address = event_data.address
       | default(state_attr(last_call_sensor_entity, 'address'), true)
       | default('', true) %}
    {% set porch = event_data.porch
       | default(state_attr(last_call_sensor_entity, 'porch'), true)
       | default('', true) %}
    {% set flat = event_data.flat
       | default(state_attr(last_call_sensor_entity, 'flat'), true)
       | default('', true) %}
    {{
      address
      ~ (', porch ' ~ porch if porch|string|length > 0 else '')
      ~ (', flat ' ~ flat if flat|string|length > 0 else '')
    }}
  notification_tag: >-
    {{ ('ufanet_intercom_' if is_live_call else 'ufanet_intercom_test_')
       ~ intercom_device_id }}
  action_open: >-
    {{ 'UFANET_OPEN_' ~ run_id }}
  notification_body: >-
    {{ notification_message_value
       ~ ('\n' ~ call_address if call_address|string|length > 0 else '')
       ~ ('\nManual test — door action is disabled.' if not is_live_call else '') }}
  can_open_door: >-
    {{ is_live_call
       and open_door_button_entity|string|length > 0
       and open_door_button_entity.startswith('button.')
       and open_door_button_entity in device_entities(intercom_device_id) }}

triggers:
  - trigger: device
    domain: ufanet_intercom
    device_id: !input intercom_device
    type: incoming_call

actions:
  - alias: Send the incoming-call notification immediately
    choose:
      - conditions: "{{ can_open_door }}"
        sequence:
          - domain: mobile_app
            type: notify
            device_id: !input notify_device
            title: "{{ notification_title_value }}"
            message: "{{ notification_body }}"
            data:
              tag: "{{ notification_tag }}"
              group: ufanet_intercom_calls
              ttl: 0
              priority: high
              channel: Ufanet Intercom
              importance: high
              confirmation: true
              url: "{{ dashboard_uri_value }}"
              clickAction: "{{ dashboard_uri_value }}"
              actions:
                - action: "{{ action_open }}"
                  title: Open door
                  authenticationRequired: "true"
                - action: URI
                  title: View camera
                  uri: "{{ dashboard_uri_value }}"
    default:
      - domain: mobile_app
        type: notify
        device_id: !input notify_device
        title: "{{ notification_title_value }}"
        message: "{{ notification_body }}"
        data:
          tag: "{{ notification_tag }}"
          group: ufanet_intercom_calls
          ttl: 0
          priority: high
          channel: Ufanet Intercom
          importance: high
          confirmation: true
          url: "{{ dashboard_uri_value }}"
          clickAction: "{{ dashboard_uri_value }}"
          actions:
            - action: URI
              title: View camera
              uri: "{{ dashboard_uri_value }}"

  - alias: Handle image readiness and the guarded door action
    choose:
      - conditions: "{{ can_open_door }}"
        sequence:
          - alias: Add the image immediately if this call already has one
            choose:
              - conditions: >-
                  {% set image_ts = as_timestamp(states(last_call_image_entity), 0) %}
                  {% set call_ts = as_timestamp(call_time, 0) %}
                  {{ image_ts > 0 and (call_ts == 0 or image_ts >= call_ts) }}
                sequence:
                  - domain: mobile_app
                    type: notify
                    device_id: !input notify_device
                    title: "{{ notification_title_value }}"
                    message: "{{ notification_body }}"
                    data:
                      tag: "{{ notification_tag }}"
                      group: ufanet_intercom_calls
                      alert_once: true
                      confirmation: true
                      url: "{{ dashboard_uri_value }}"
                      clickAction: "{{ dashboard_uri_value }}"
                      image: >-
                        /api/image_proxy/{{ last_call_image_entity }}
                      actions:
                        - action: "{{ action_open }}"
                          title: Open door
                          authenticationRequired: "true"
                        - action: URI
                          title: View camera
                          uri: "{{ dashboard_uri_value }}"

          - alias: Wait for either the door action or an image state change
            wait_for_trigger:
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ action_open }}"
                id: open_door
              - trigger: state
                entity_id: !input last_call_image
                id: image_changed
            timeout:
              seconds: !input action_timeout
            continue_on_timeout: true

          - alias: Handle the first result
            choose:
              - conditions: >-
                  {{ wait.trigger is not none
                     and wait.trigger.id == 'open_door' }}
                sequence:
                  - alias: Revalidate the relay immediately before pressing it
                    choose:
                      - conditions: >-
                          {{ open_door_button_entity|string|length > 0
                             and open_door_button_entity.startswith('button.')
                             and open_door_button_entity
                                 in device_entities(intercom_device_id) }}
                        sequence:
                          - action: button.press
                            target:
                              entity_id: "{{ open_door_button_entity }}"
                    default:
                      - domain: mobile_app
                        type: notify
                        device_id: !input notify_device
                        title: "{{ notification_title_value }}"
                        message: >-
                          {{ notification_body
                             ~ '\nOpen door action is no longer available.' }}
                        data:
                          tag: "{{ notification_tag }}"
                          group: ufanet_intercom_calls
                          alert_once: true
                          url: "{{ dashboard_uri_value }}"
                          clickAction: "{{ dashboard_uri_value }}"
                          actions:
                            - action: URI
                              title: View camera
                              uri: "{{ dashboard_uri_value }}"
                      - stop: Open door button no longer matches the intercom
                  - alias: Remove the door action after sending the command
                    domain: mobile_app
                    type: notify
                    device_id: !input notify_device
                    title: "{{ notification_title_value }}"
                    message: >-
                      {{ notification_body ~ '\nOpen door command sent.' }}
                    data:
                      tag: "{{ notification_tag }}"
                      group: ufanet_intercom_calls
                      alert_once: true
                      url: "{{ dashboard_uri_value }}"
                      clickAction: "{{ dashboard_uri_value }}"
                      actions:
                        - action: URI
                          title: View camera
                          uri: "{{ dashboard_uri_value }}"
                  - stop: Open door action handled

              - conditions: >-
                  {{ wait.trigger is not none
                     and wait.trigger.id == 'image_changed' }}
                sequence:
                  - alias: Update with image only inside the configured image window
                    choose:
                      - conditions: >-
                          {% set image_ts = as_timestamp(states(last_call_image_entity), 0) %}
                          {% set call_ts = as_timestamp(call_time, 0) %}
                          {% set elapsed = as_timestamp(now()) - (run_started_ts | float(0)) %}
                          {{ elapsed <= (image_delay_value | float(0))
                             and image_ts > 0
                             and (call_ts == 0 or image_ts >= call_ts) }}
                        sequence:
                          - domain: mobile_app
                            type: notify
                            device_id: !input notify_device
                            title: "{{ notification_title_value }}"
                            message: "{{ notification_body }}"
                            data:
                              tag: "{{ notification_tag }}"
                              group: ufanet_intercom_calls
                              alert_once: true
                              confirmation: true
                              url: "{{ dashboard_uri_value }}"
                              clickAction: "{{ dashboard_uri_value }}"
                              image: >-
                                /api/image_proxy/{{ last_call_image_entity }}
                              actions:
                                - action: "{{ action_open }}"
                                  title: Open door
                                  authenticationRequired: "true"
                                - action: URI
                                  title: View camera
                                  uri: "{{ dashboard_uri_value }}"

                  - alias: Keep waiting for the same unique door action
                    wait_for_trigger:
                      - trigger: event
                        event_type: mobile_app_notification_action
                        event_data:
                          action: "{{ action_open }}"
                        id: open_door
                    timeout: "{{ wait.remaining }}"
                    continue_on_timeout: true

                  - alias: Handle door action or expiration after image update
                    choose:
                      - conditions: >-
                          {{ wait.trigger is not none
                             and wait.trigger.id == 'open_door' }}
                        sequence:
                          - alias: Revalidate the relay immediately before pressing it
                            choose:
                              - conditions: >-
                                  {{ open_door_button_entity|string|length > 0
                                     and open_door_button_entity.startswith('button.')
                                     and open_door_button_entity
                                         in device_entities(intercom_device_id) }}
                                sequence:
                                  - action: button.press
                                    target:
                                      entity_id: "{{ open_door_button_entity }}"
                            default:
                              - domain: mobile_app
                                type: notify
                                device_id: !input notify_device
                                title: "{{ notification_title_value }}"
                                message: >-
                                  {{ notification_body
                                     ~ '\nOpen door action is no longer available.' }}
                                data:
                                  tag: "{{ notification_tag }}"
                                  group: ufanet_intercom_calls
                                  alert_once: true
                                  url: "{{ dashboard_uri_value }}"
                                  clickAction: "{{ dashboard_uri_value }}"
                                  actions:
                                    - action: URI
                                      title: View camera
                                      uri: "{{ dashboard_uri_value }}"
                              - stop: Open door button no longer matches the intercom
                          - domain: mobile_app
                            type: notify
                            device_id: !input notify_device
                            title: "{{ notification_title_value }}"
                            message: >-
                              {{ notification_body ~ '\nOpen door command sent.' }}
                            data:
                              tag: "{{ notification_tag }}"
                              group: ufanet_intercom_calls
                              alert_once: true
                              url: "{{ dashboard_uri_value }}"
                              clickAction: "{{ dashboard_uri_value }}"
                              actions:
                                - action: URI
                                  title: View camera
                                  uri: "{{ dashboard_uri_value }}"
                    default:
                      - domain: mobile_app
                        type: notify
                        device_id: !input notify_device
                        title: "{{ notification_title_value }}"
                        message: >-
                          {{ notification_body ~ '\nOpen door action expired.' }}
                        data:
                          tag: "{{ notification_tag }}"
                          group: ufanet_intercom_calls
                          alert_once: true
                          url: "{{ dashboard_uri_value }}"
                          clickAction: "{{ dashboard_uri_value }}"
                          actions:
                            - action: URI
                              title: View camera
                              uri: "{{ dashboard_uri_value }}"
            default:
              - alias: Remove the door action after its timeout
                domain: mobile_app
                type: notify
                device_id: !input notify_device
                title: "{{ notification_title_value }}"
                message: >-
                  {{ notification_body ~ '\nOpen door action expired.' }}
                data:
                  tag: "{{ notification_tag }}"
                  group: ufanet_intercom_calls
                  alert_once: true
                  url: "{{ dashboard_uri_value }}"
                  clickAction: "{{ dashboard_uri_value }}"
                  actions:
                    - action: URI
                      title: View camera
                      uri: "{{ dashboard_uri_value }}"

    default:
      - alias: Wait for a private image when no door action is exposed
        wait_template: >-
          {% set image_ts = as_timestamp(states(last_call_image_entity), 0) %}
          {% set call_ts = as_timestamp(call_time, 0) %}
          {{ image_ts > 0 and (call_ts == 0 or image_ts >= call_ts) }}
        timeout:
          seconds: !input image_delay
        continue_on_timeout: false
      - domain: mobile_app
        type: notify
        device_id: !input notify_device
        title: "{{ notification_title_value }}"
        message: "{{ notification_body }}"
        data:
          tag: "{{ notification_tag }}"
          group: ufanet_intercom_calls
          alert_once: true
          confirmation: true
          url: "{{ dashboard_uri_value }}"
          clickAction: "{{ dashboard_uri_value }}"
          image: >-
            /api/image_proxy/{{ last_call_image_entity }}
          actions:
            - action: URI
              title: View camera
              uri: "{{ dashboard_uri_value }}"

mode: restart
